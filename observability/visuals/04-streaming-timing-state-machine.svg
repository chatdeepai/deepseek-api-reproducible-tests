<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">Streaming Timing State Machine</title>
<desc id="visual-description">Horizontal streaming state machine from request start through network data, parsed JSON, visible content, finish reason, terminal usage, and safe span closure, with timeout and cancellation exits.</desc>
<defs>
<linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#071524"/>
<stop offset="100%" stop-color="#0a1b2c"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgGradient)"/>
<circle cx="1460" cy="-30" r="340" fill="#142d49" opacity="0.55"/>
<circle cx="25" cy="930" r="340" fill="#0b303c" opacity="0.55"/>
<rect x="72" y="52" width="710" height="44" fill="#0b2b35" rx="22" stroke="#20707b" stroke-width="2"/>
<text x="96" y="81" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">CHAT-DEEP.AI  |  DEEPSEEK OBSERVABILITY</text>
<text x="72" y="165" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="800" text-anchor="start">Streaming Timing State Machine</text>
<text x="72" y="209" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Measure transport, parsed events, visible content, finish state, and terminal usage as separate milestones</text>
<rect x="72" y="227" width="1456" height="4" fill="#2dd4c6" rx="2"/>
<line x1="92" y1="454" x2="1436" y2="454" stroke="#284d68" stroke-width="8" stroke-linecap="round"/>
<circle cx="92" cy="454" r="30" fill="#0b2034" stroke="#5ea8ff" stroke-width="5"/>
<circle cx="92" cy="454" r="11" fill="#5ea8ff"/>
<rect x="0" y="310" width="184" height="84" fill="#10283f" rx="16" stroke="#5ea8ff" stroke-width="2"/>
<text x="92" y="345" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">REQUEST</text>
<text x="92" y="376" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">t0</text>
<line x1="92" y1="394" x2="92" y2="420" stroke="#5ea8ff" stroke-width="2" stroke-linecap="round"/>
<circle cx="316" cy="454" r="30" fill="#0b2034" stroke="#a78bfa" stroke-width="5"/>
<circle cx="316" cy="454" r="11" fill="#a78bfa"/>
<rect x="224" y="513" width="184" height="84" fill="#10283f" rx="16" stroke="#a78bfa" stroke-width="2"/>
<text x="316" y="548" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">NETWORK DATA</text>
<text x="316" y="579" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">transport</text>
<line x1="316" y1="488" x2="316" y2="513" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
<circle cx="540" cy="454" r="30" fill="#0b2034" stroke="#2dd4c6" stroke-width="5"/>
<circle cx="540" cy="454" r="11" fill="#2dd4c6"/>
<rect x="448" y="310" width="184" height="84" fill="#10283f" rx="16" stroke="#2dd4c6" stroke-width="2"/>
<text x="540" y="345" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">PARSED JSON</text>
<text x="540" y="376" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">first event</text>
<line x1="540" y1="394" x2="540" y2="420" stroke="#2dd4c6" stroke-width="2" stroke-linecap="round"/>
<circle cx="764" cy="454" r="30" fill="#0b2034" stroke="#43df88" stroke-width="5"/>
<circle cx="764" cy="454" r="11" fill="#43df88"/>
<rect x="672" y="513" width="184" height="84" fill="#10283f" rx="16" stroke="#43df88" stroke-width="2"/>
<text x="764" y="548" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">VISIBLE CONTENT</text>
<text x="764" y="579" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">TTFC</text>
<line x1="764" y1="488" x2="764" y2="513" stroke="#43df88" stroke-width="2" stroke-linecap="round"/>
<circle cx="988" cy="454" r="30" fill="#0b2034" stroke="#ffbd22" stroke-width="5"/>
<circle cx="988" cy="454" r="11" fill="#ffbd22"/>
<rect x="896" y="310" width="184" height="84" fill="#10283f" rx="16" stroke="#ffbd22" stroke-width="2"/>
<text x="988" y="345" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">FINISH REASON</text>
<text x="988" y="376" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">terminal state</text>
<line x1="988" y1="394" x2="988" y2="420" stroke="#ffbd22" stroke-width="2" stroke-linecap="round"/>
<circle cx="1212" cy="454" r="30" fill="#0b2034" stroke="#5ea8ff" stroke-width="5"/>
<circle cx="1212" cy="454" r="11" fill="#5ea8ff"/>
<rect x="1120" y="513" width="184" height="84" fill="#10283f" rx="16" stroke="#5ea8ff" stroke-width="2"/>
<text x="1212" y="548" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">FINAL USAGE</text>
<text x="1212" y="579" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">usage chunk</text>
<line x1="1212" y1="488" x2="1212" y2="513" stroke="#5ea8ff" stroke-width="2" stroke-linecap="round"/>
<circle cx="1436" cy="454" r="30" fill="#0b2034" stroke="#43df88" stroke-width="5"/>
<circle cx="1436" cy="454" r="11" fill="#43df88"/>
<rect x="1344" y="310" width="184" height="84" fill="#10283f" rx="16" stroke="#43df88" stroke-width="2"/>
<text x="1436" y="345" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">CLOSE SPAN</text>
<text x="1436" y="376" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">DONE</text>
<line x1="1436" y1="394" x2="1436" y2="420" stroke="#43df88" stroke-width="2" stroke-linecap="round"/>
<rect x="196" y="690" width="1208" height="106" fill="#351a25" rx="22" stroke="#ff6b81" stroke-width="2"/>
<text x="230" y="728" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">EARLY EXIT</text>
<text x="230" y="768" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">timeout  |  user cancellation  |  parse failure  |  incomplete terminal state</text>
<line x1="1044" y1="744" x2="1122" y2="744" stroke="#ff6b81" stroke-width="4" stroke-linecap="round"/>
<polygon points="1130,744 1117.9,751.0 1117.9,737.0" fill="#ff6b81"/>
<rect x="1146" y="719" width="226" height="50" fill="#0b2034" rx="25" stroke="#ff6b81" stroke-width="2"/>
<text x="1259" y="749" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">CLASSIFY + CLOSE</text>
<line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="874" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Conceptual observability diagram  |  no live-result claims  |  timing method, with no latency observation</text>
<text x="1528" y="875" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end">chat-deep.ai</text>
</svg>
