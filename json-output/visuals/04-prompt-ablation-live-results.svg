    <text x="650" y="300">HTTP</text>
    <text x="790" y="300">CONTENT</text>
    <text x="930" y="300">PARSE</text>
    <text x="1055" y="300">SCHEMA / FACTS</text>
    <text x="1270" y="300">OUTPUT TOKENS</text>
    <text x="1420" y="300">ELAPSED</text>
