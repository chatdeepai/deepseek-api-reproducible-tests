  <text x="72" y="201" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Keep the provider-specific request path explicit and retain only field-presence metadata</text>
  <rect x="72" y="228" width="1456" height="3" rx="1.5" fill="url(#accentGradient)"/><rect x="72" y="292" width="420" height="300" rx="24" fill="#10283f" stroke="#5ea8ff" stroke-width="2" opacity="1"/><text x="282" y="340" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">PYTHON CALL SHAPE</text><rect x="106" y="380" width="352" height="116" rx="18" fill="#081a2a" stroke="#284d68" stroke-width="1.5" opacity="1"/><text x="128" y="419" fill="#5ea8ff" font-family="Cascadia Mono, Consolas, monospace" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">extra_body = {&quot;thinking&quot;:</text><text x="128" y="455" fill="#5ea8ff" font-family="Cascadia Mono, Consolas, monospace" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">  {&quot;type&quot;: MODE}}</text><text x="282" y="544" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="580" text-anchor="middle" letter-spacing="0" opacity="1">MODE is an allowlisted request setting.</text><rect x="554" y="292" width="420" height="300" rx="24" fill="#10283f" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="764" y="340" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">SERIALIZER CHECK</text><rect x="624" y="382" width="280" height="50" rx="25" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="764" y="415" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">thinking.type</text><text x="764" y="480" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">field path present?</text><text x="764" y="514" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">nested type preserved?</text><text x="764" y="548" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">unsupported value rejected?</text><rect x="1036" y="292" width="492" height="300" rx="24" fill="#0d2633" stroke="#2dd4c6" stroke-width="2" opacity="1"/><text x="1282" y="340" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">RESPONSE HANDLER</text><text x="1080" y="409" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">• content field present?</text><text x="1080" y="451" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">• reasoning field present?</text><text x="1080" y="493" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">• finish state recorded?</text><text x="1080" y="535" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">• no reasoning text retained</text><line x1="492" y1="442" x2="540" y2="442" stroke="#2dd4c6" stroke-width="5" opacity="1" marker-end="url(#arrowTeal)"/><line x1="974" y1="442" x2="1022" y2="442" stroke="#2dd4c6" stroke-width="5" opacity="1" marker-end="url(#arrowTeal)"/><rect x="180" y="638" width="1240" height="154" rx="24" fill="#10283f" stroke="#ffbd22" stroke-width="2" opacity="1"/><text x="220" y="683" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="start" letter-spacing="0" opacity="1">DOCUMENTED REQUEST SHAPE</text><text x="220" y="727" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Enabled and disabled are request branches—not evidence of an observed response.</text><text x="220" y="766" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">Bind output behavior only after a sanitized Python-specific live run.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" opacity="1"/>
