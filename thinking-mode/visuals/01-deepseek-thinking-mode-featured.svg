<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Thinking Mode live API test guide</title>
  <desc id="desc">Featured image for a live-tested guide to DeepSeek reasoning content, effort levels, streaming, tool calls, and cost.</desc>
  <defs>
