<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek JSON output and model routing live checks</title>
  <desc id="desc">Live API evidence showing an empty JSON output retry and the difference between listed model IDs and accepted legacy aliases.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" fill="#0f172a">Two edge cases worth monitoring</text>
  <text x="90" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#475569">Live checks against the official API on July 27, 2026 UTC</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="90" y="208" width="680" height="540" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="132" y="264" font-size="25" font-weight="800" fill="#1d4ed8">JSON OUTPUT WITH THINKING</text>

    <rect x="132" y="312" width="596" height="138" rx="22" fill="#fff7ed"/>
    <text x="166" y="354" font-size="22" font-weight="800" fill="#c2410c">MINIMAL PROMPT</text>
    <text x="166" y="397" font-size="26" font-weight="800" fill="#0f172a">HTTP 200 - content empty</text>
    <text x="166" y="430" font-size="20" fill="#7c2d12">finish_reason stop; 9 reasoning tokens</text>

    <rect x="132" y="474" width="596" height="138" rx="22" fill="#ecfdf5"/>
    <text x="166" y="516" font-size="22" font-weight="800" fill="#047857">EXPLICIT SYSTEM INSTRUCTION</text>
    <text x="166" y="559" font-size="26" font-weight="800" fill="#0f172a">HTTP 200 - JSON valid</text>
    <text x="166" y="592" font-size="20" fill="#065f46">Retry succeeded with the required two keys.</text>

    <text x="132" y="662" font-size="22" fill="#475569">Validate content after every 200 response.</text>
    <text x="132" y="700" font-size="22" fill="#475569">Retry empty output with a bounded policy.</text>

    <rect x="830" y="208" width="680" height="540" rx="30" fill="#0f172a"/>
    <text x="872" y="264" font-size="25" font-weight="800" fill="#7dd3fc">MODEL LISTING VS COMPLETION ROUTING</text>
    <text x="872" y="316" font-size="21" fill="#94a3b8">GET /models returned two IDs:</text>

    <rect x="872" y="342" width="596" height="62" rx="16" fill="#172554"/>
    <text x="900" y="382" font-size="24" font-weight="800" fill="#dbeafe">deepseek-v4-flash</text>
    <rect x="872" y="420" width="596" height="62" rx="16" fill="#134e4a"/>
    <text x="900" y="460" font-size="24" font-weight="800" fill="#d1fae5">deepseek-v4-pro</text>

    <text x="872" y="536" font-size="21" fill="#94a3b8">Legacy completion probes:</text>
    <text x="872" y="584" font-size="23" fill="#f8fafc">deepseek-chat</text>
    <text x="1240" y="584" font-size="23" font-weight="800" fill="#86efac">200 -> V4 Flash</text>
    <text x="872" y="632" font-size="23" fill="#f8fafc">deepseek-reasoner</text>
    <text x="1240" y="632" font-size="23" font-weight="800" fill="#86efac">200 -> V4 Flash</text>
    <text x="872" y="690" font-size="21" fill="#fbbf24">Use explicit V4 IDs; aliases were absent from discovery.</text>
  </g>
  <text x="90" y="826" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#475569">These are dated compatibility observations. Routing and validation may change after the test date.</text>
</svg>
