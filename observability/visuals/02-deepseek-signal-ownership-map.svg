<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">Who Owns Each DeepSeek Signal?</title>
<desc id="visual-description">Four signal domains distinguish provider-returned fields, application measurements, evaluator results, and account or reconciled evidence.</desc>
<defs>
<linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#071524"/>
<stop offset="100%" stop-color="#0a1b2c"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgGradient)"/>
<circle cx="1460" cy="-30" r="340" fill="#142d49" opacity="0.55"/>
<circle cx="25" cy="930" r="340" fill="#0b303c" opacity="0.55"/>
<rect x="72" y="52" width="710" height="44" fill="#0b2b35" rx="22" stroke="#20707b" stroke-width="2"/>
<text x="96" y="81" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">CHAT-DEEP.AI  |  DEEPSEEK OBSERVABILITY</text>
<text x="72" y="165" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="800" text-anchor="start">Who Owns Each DeepSeek Signal?</text>
<text x="72" y="209" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Classify evidence before aggregation so estimates never masquerade as provider-returned facts</text>
<rect x="72" y="227" width="1456" height="4" fill="#2dd4c6" rx="2"/>
<rect x="72" y="286" width="340" height="372" fill="#10283f" rx="22" stroke="#5ea8ff" stroke-width="2"/>
<rect x="92" y="304" width="300" height="34" fill="#0b2034" rx="17" stroke="#5ea8ff" stroke-width="2"/>
<text x="242" y="325" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SOURCE: RESPONSE</text>
<text x="96" y="382" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">PROVIDER-RETURNED</text>
<circle cx="102" cy="418" r="6" fill="#5ea8ff"/>
<text x="120" y="424" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">model identifier</text>
<circle cx="102" cy="452" r="6" fill="#5ea8ff"/>
<text x="120" y="458" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">finish reason</text>
<circle cx="102" cy="486" r="6" fill="#5ea8ff"/>
<text x="120" y="492" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">usage totals</text>
<circle cx="102" cy="520" r="6" fill="#5ea8ff"/>
<text x="120" y="526" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">cache hit / miss tokens</text>
<rect x="444" y="286" width="340" height="372" fill="#10283f" rx="22" stroke="#2dd4c6" stroke-width="2"/>
<rect x="464" y="304" width="300" height="34" fill="#0b2034" rx="17" stroke="#2dd4c6" stroke-width="2"/>
<text x="614" y="325" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SOURCE: CLIENT CLOCK</text>
<text x="468" y="382" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">APPLICATION-MEASURED</text>
<circle cx="474" cy="418" r="6" fill="#2dd4c6"/>
<text x="492" y="424" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">request duration</text>
<circle cx="474" cy="452" r="6" fill="#2dd4c6"/>
<text x="492" y="458" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">first parsed event</text>
<circle cx="474" cy="486" r="6" fill="#2dd4c6"/>
<text x="492" y="492" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">first visible content</text>
<circle cx="474" cy="520" r="6" fill="#2dd4c6"/>
<text x="492" y="526" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">retry / cancel state</text>
<rect x="816" y="286" width="340" height="372" fill="#10283f" rx="22" stroke="#a78bfa" stroke-width="2"/>
<rect x="836" y="304" width="300" height="34" fill="#0b2034" rx="17" stroke="#a78bfa" stroke-width="2"/>
<text x="986" y="325" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SOURCE: TEST CONTRACT</text>
<text x="840" y="382" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">EVALUATOR-PRODUCED</text>
<circle cx="846" cy="418" r="6" fill="#a78bfa"/>
<text x="864" y="424" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">schema pass / fail</text>
<circle cx="846" cy="452" r="6" fill="#a78bfa"/>
<text x="864" y="458" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">word-count contract</text>
<circle cx="846" cy="486" r="6" fill="#a78bfa"/>
<text x="864" y="492" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">grounding checks</text>
<circle cx="846" cy="520" r="6" fill="#a78bfa"/>
<text x="864" y="526" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">human feedback</text>
<rect x="1188" y="286" width="340" height="372" fill="#10283f" rx="22" stroke="#ffbd22" stroke-width="2"/>
<rect x="1208" y="304" width="300" height="34" fill="#0b2034" rx="17" stroke="#ffbd22" stroke-width="2"/>
<text x="1358" y="325" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SOURCE: EXTERNAL RECORD</text>
<text x="1212" y="382" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">ACCOUNT / RECONCILED</text>
<circle cx="1218" cy="418" r="6" fill="#ffbd22"/>
<text x="1236" y="424" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">dated price snapshot</text>
<circle cx="1218" cy="452" r="6" fill="#ffbd22"/>
<text x="1236" y="458" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">estimated token cost</text>
<circle cx="1218" cy="486" r="6" fill="#ffbd22"/>
<text x="1236" y="492" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">billing reconciliation</text>
<circle cx="1218" cy="520" r="6" fill="#ffbd22"/>
<text x="1236" y="526" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">budget status</text>
<rect x="188" y="700" width="1224" height="96" fill="#0d333a" rx="22" stroke="#2dd4c6" stroke-width="2"/>
<text x="800" y="740" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">OWNERSHIP BEFORE AGGREGATION</text>
<text x="800" y="776" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="middle">record source + unit + schema version + derivation status</text>
<line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="874" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Conceptual observability diagram  |  no live-result claims  |  source taxonomy only</text>
<text x="1528" y="875" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end">chat-deep.ai</text>
</svg>
