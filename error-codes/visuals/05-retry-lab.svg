<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local retry policy simulation for DeepSeek API errors</title>
  <desc id="desc">A local-only simulated retry policy separating non-retryable client conditions from bounded retries for rate limits, server failures, and timeouts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f7faff"/>
  <rect x="0" y="0" width="1600" height="88" fill="url(#banner)"/>
  <rect x="88" y="24" width="290" height="42" rx="21" fill="#ffffff" opacity=".18"/>
  <text x="233" y="52" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#ffffff">LOCAL SIMULATION</text>
  <text x="1512" y="53" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#dbeafe">Provider requests sent: 0 · Live retries: 0</text>
  <text x="88" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850" fill="#0b1f3a">A bounded retry policy</text>
  <text x="88" y="201" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">Correct permanent failures; queue and back off only when a repeat may succeed.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="246" width="662" height="474" rx="28" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <rect x="798" y="246" width="714" height="474" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="246" width="662" height="78" rx="28" fill="#fff1f2"/>
    <rect x="88" y="298" width="662" height="26" fill="#fff1f2"/>
    <circle cx="132" cy="285" r="22" fill="#be123c"/>
    <path d="M122 285h20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="293" font-size="27" font-weight="850" fill="#881337">NO RETRY WITHOUT A CHANGE</text>

    <g transform="translate(126 358)">
      <rect width="276" height="88" rx="20" fill="#fff7f7"/>
      <text x="28" y="39" font-size="28" font-weight="850" fill="#9f1239">400</text>
      <text x="95" y="39" font-size="20" font-weight="750" fill="#0b1f3a">Fix body format</text>
      <text x="28" y="68" font-size="17" fill="#64748b">Retries: 0</text>
    </g>
    <g transform="translate(430 358)">
      <rect width="282" height="88" rx="20" fill="#fff7f7"/>
      <text x="28" y="39" font-size="28" font-weight="850" fill="#9f1239">401</text>
      <text x="95" y="39" font-size="20" font-weight="750" fill="#0b1f3a">Repair credentials</text>
      <text x="28" y="68" font-size="17" fill="#64748b">Retries: 0</text>
    </g>
    <g transform="translate(126 470)">
      <rect width="276" height="88" rx="20" fill="#fff7f7"/>
      <text x="28" y="39" font-size="28" font-weight="850" fill="#9f1239">402</text>
      <text x="95" y="39" font-size="20" font-weight="750" fill="#0b1f3a">Resolve funding</text>
      <text x="28" y="68" font-size="17" fill="#64748b">Retries: 0</text>
    </g>
    <g transform="translate(430 470)">
      <rect width="282" height="88" rx="20" fill="#fff7f7"/>
      <text x="28" y="39" font-size="28" font-weight="850" fill="#9f1239">422</text>
      <text x="95" y="39" font-size="20" font-weight="750" fill="#0b1f3a">Fix parameters</text>
      <text x="28" y="68" font-size="17" fill="#64748b">Retries: 0</text>
    </g>
    <rect x="126" y="592" width="586" height="88" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="154" y="627" font-size="19" font-weight="800" fill="#0b1f3a">RULE</text>
    <text x="154" y="657" font-size="19" fill="#41536b">Change the cause before making another provider call.</text>

    <rect x="798" y="246" width="714" height="78" rx="28" fill="#eff6ff"/>
    <rect x="798" y="298" width="714" height="26" fill="#eff6ff"/>
    <circle cx="842" cy="285" r="22" fill="#1d4ed8"/>
    <path d="M850 273a14 14 0 1 0 4 18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M849 270l2 11-11-1" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="880" y="293" font-size="27" font-weight="850" fill="#1e3a8a">RETRY WITH A HARD CAP</text>

    <g transform="translate(836 356)">
      <rect width="638" height="82" rx="20" fill="#f6faff"/>
      <g font-size="25" font-weight="850" fill="#1d4ed8">
        <text x="26" y="49">429</text><text x="118" y="49">500</text><text x="210" y="49">503</text>
      </g>
      <rect x="312" y="20" width="292" height="42" rx="21" fill="#e0ecff"/>
      <text x="458" y="48" text-anchor="middle" font-size="19" font-weight="800" fill="#1e3a8a">NETWORK TIMEOUT</text>
    </g>

    <text x="836" y="482" font-size="19" font-weight="800" letter-spacing="2" fill="#64748b">SIMULATED BACKOFF SCHEDULE</text>
    <circle cx="880" cy="554" r="34" fill="#1d4ed8"/>
    <text x="880" y="563" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">1</text>
    <rect x="914" y="541" width="174" height="26" rx="13" fill="#93c5fd"/>
    <text x="1001" y="560" text-anchor="middle" font-size="18" font-weight="850" fill="#0b1f3a">WAIT 500 ms</text>
    <path d="M1088 554h68" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M1146 544l12 10-12 10" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1196" cy="554" r="34" fill="#1d4ed8"/>
    <text x="1196" y="563" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">2</text>
    <rect x="1230" y="541" width="210" height="26" rx="13" fill="#93c5fd"/>
    <text x="1335" y="560" text-anchor="middle" font-size="18" font-weight="850" fill="#0b1f3a">WAIT 1,000 ms</text>

    <rect x="836" y="608" width="638" height="72" rx="18" fill="#eaf3ff" stroke="#bfdbfe" stroke-width="2"/>
    <path d="M866 638h22v18h-22zM871 638v-7a6 6 0 0 1 12 0v7" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="908" y="639" font-size="19" font-weight="800" fill="#0b1f3a">Maximum retries: 2</text>
    <text x="908" y="664" font-size="17" fill="#41536b">Use a duplicate-work guard; timeout outcome is unknown.</text>
  </g>

  <rect x="88" y="757" width="1424" height="70" rx="18" fill="#0b1f3a"/>
  <text x="122" y="799" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#dbeafe">Deterministic policy test only — these rows are not observed DeepSeek provider responses.</text>
  <text x="88" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Local simulation generated July 27, 2026 UTC</text>
  <text x="1512" y="872" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">0 PROVIDER REQUESTS</text>
</svg>
