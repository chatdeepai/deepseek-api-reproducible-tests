  <text x="112" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff">DeepSeek Thinking Mode</text>
  <text x="112" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="500" fill="#cbd5e1">reasoning_content, effort, streaming, tool calls, and cost</text>

