<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Safe logging for DeepSeek API error evidence</title>
  <desc id="desc">A comparison of unsafe sensitive logging and a publishable sanitized metadata record from a live error test.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="17" flood-color="#0b1f3a" flood-opacity=".11"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <text x="88" y="94" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#2563eb">REPRODUCIBLE WITHOUT PUBLISHING SECRETS</text>
  <text x="88" y="161" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">Log evidence, not credentials</text>
  <text x="88" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">A useful error record needs status and transport facts—not sensitive request data.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="256" width="618" height="440" rx="28" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <rect x="754" y="256" width="758" height="440" rx="28" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="256" width="618" height="82" rx="28" fill="#fff1f2"/>
    <rect x="88" y="310" width="618" height="28" fill="#fff1f2"/>
    <circle cx="134" cy="297" r="23" fill="#be123c"/>
    <path d="M124 287l20 20M144 287l-20 20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="176" y="306" font-size="28" font-weight="850" fill="#881337">UNSAFE TO STORE OR PUBLISH</text>

    <g transform="translate(126 376)">
      <circle cx="14" cy="14" r="14" fill="#be123c"/>
      <text x="14" y="20" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">×</text>
      <text x="46" y="21" font-size="22" font-weight="700" fill="#0b1f3a">Credential header values</text>
    </g>
    <g transform="translate(126 437)">
      <circle cx="14" cy="14" r="14" fill="#be123c"/>
      <text x="14" y="20" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">×</text>
      <text x="46" y="21" font-size="22" font-weight="700" fill="#0b1f3a">Raw keys or environment dumps</text>
    </g>
    <g transform="translate(126 498)">
      <circle cx="14" cy="14" r="14" fill="#be123c"/>
      <text x="14" y="20" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">×</text>
      <text x="46" y="21" font-size="22" font-weight="700" fill="#0b1f3a">Full bodies with user content</text>
    </g>
    <g transform="translate(126 559)">
      <circle cx="14" cy="14" r="14" fill="#be123c"/>
      <text x="14" y="20" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">×</text>
      <text x="46" y="21" font-size="22" font-weight="700" fill="#0b1f3a">Account identifiers or finances</text>
    </g>
    <rect x="126" y="622" width="542" height="44" rx="14" fill="#fff7f7"/>
    <text x="397" y="650" text-anchor="middle" font-size="18" font-weight="750" fill="#9f1239">Block publication if a redaction scan fails.</text>

    <rect x="754" y="256" width="758" height="82" rx="28" fill="#ecfdf5"/>
    <rect x="754" y="310" width="758" height="28" fill="#ecfdf5"/>
    <circle cx="800" cy="297" r="23" fill="#047857"/>
    <path d="M789 297l8 8 15-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="842" y="306" font-size="28" font-weight="850" fill="#065f46">PUBLISHABLE SANITIZED RECORD</text>

    <rect x="792" y="372" width="682" height="252" rx="20" fill="#0b1f3a"/>
    <text x="824" y="411" font-size="18" font-weight="700" fill="#7dd3fc">{</text>
    <text x="846" y="444" font-size="18" fill="#e2e8f0">"test_id": "malformed_json",</text>
    <text x="846" y="477" font-size="18" fill="#e2e8f0">"http_status": 400,</text>
    <text x="846" y="510" font-size="18" fill="#e2e8f0">"latency_ms": 282,</text>
    <text x="846" y="543" font-size="18" fill="#e2e8f0">"response_type": "application/octet-stream",</text>
    <text x="846" y="576" font-size="18" fill="#e2e8f0">"body_bytes": 93, "retry_after_present": false</text>
    <text x="824" y="606" font-size="18" font-weight="700" fill="#7dd3fc">}</text>
    <rect x="792" y="644" width="682" height="38" rx="12" fill="#ecfdf5"/>
    <text x="1133" y="669" text-anchor="middle" font-size="17" font-weight="750" fill="#065f46">Synthetic request · no account data · no hidden reasoning</text>
  </g>

  <rect x="88" y="742" width="1424" height="78" rx="20" fill="#eaf3ff" stroke="#bfdbfe" stroke-width="2"/>
  <path d="M126 775h24v18h-24zM131 775v-8a7 7 0 0 1 14 0v8" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <text x="174" y="776" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="850" fill="#0b1f3a">Publication gate</text>
  <text x="174" y="804" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#41536b">Reject artifacts containing credential material, private identifiers, user prompts, or unreviewed raw bodies.</text>
  <text x="88" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC</text>
  <text x="1512" y="872" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">SANITIZED LIVE METADATA</text>
</svg>
