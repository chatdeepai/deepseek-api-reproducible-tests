<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">DeepSeek Tool and Agent Trace Waterfall</title>
<desc id="visual-description">Trace waterfall with application, DeepSeek model, policy gate, tool adapter, and evaluator lanes across proposal, validation, authorization, execution, continuation, and final validation.</desc>
<defs>
<linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#071524"/>
<stop offset="100%" stop-color="#0a1b2c"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgGradient)"/>
<circle cx="1460" cy="-30" r="340" fill="#142d49" opacity="0.55"/>
<circle cx="25" cy="930" r="340" fill="#0b303c" opacity="0.55"/>
<rect x="72" y="52" width="710" height="44" fill="#0b2b35" rx="22" stroke="#20707b" stroke-width="2"/>
<text x="96" y="81" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">CHAT-DEEP.AI  |  DEEPSEEK OBSERVABILITY</text>
<text x="72" y="165" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="800" text-anchor="start">DeepSeek Tool and Agent Trace Waterfall</text>
<text x="72" y="209" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">A model can propose a call; only the application validates, authorizes, executes, and records the side effect</text>
<rect x="72" y="227" width="1456" height="4" fill="#2dd4c6" rx="2"/>
<text x="72" y="306" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">APPLICATION</text>
<line x1="238" y1="300" x2="1528" y2="300" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="396" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">DEEPSEEK MODEL</text>
<line x1="238" y1="390" x2="1528" y2="390" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="486" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">POLICY GATE</text>
<line x1="238" y1="480" x2="1528" y2="480" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="576" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">TOOL ADAPTER</text>
<line x1="238" y1="570" x2="1528" y2="570" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="666" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">EVALUATOR</text>
<line x1="238" y1="660" x2="1528" y2="660" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<rect x="258" y="275" width="180" height="50" fill="#10283f" rx="15" stroke="#5ea8ff" stroke-width="2"/>
<text x="348" y="305" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">INBOUND</text>
<line x1="438" y1="300" x2="416" y2="382" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<polygon points="414,390 410.4,376.5 423.9,380.1" fill="#a78bfa"/>
<rect x="424" y="365" width="184" height="50" fill="#10283f" rx="15" stroke="#a78bfa" stroke-width="2"/>
<text x="516" y="395" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">PROPOSE CALL</text>
<line x1="608" y1="390" x2="586" y2="472" stroke="#ffbd22" stroke-width="3" stroke-linecap="round"/>
<polygon points="584,480 580.4,466.5 593.9,470.1" fill="#ffbd22"/>
<rect x="594" y="455" width="190" height="50" fill="#10283f" rx="15" stroke="#ffbd22" stroke-width="2"/>
<text x="689" y="485" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">PARSE + SCHEMA</text>
<line x1="784" y1="480" x2="768" y2="480" stroke="#ffbd22" stroke-width="3" stroke-linecap="round"/>
<polygon points="760,480 772.1,473.0 772.1,487.0" fill="#ffbd22"/>
<rect x="770" y="455" width="164" height="50" fill="#10283f" rx="15" stroke="#ffbd22" stroke-width="2"/>
<text x="852" y="485" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">AUTHORIZE</text>
<line x1="934" y1="480" x2="912" y2="562" stroke="#2dd4c6" stroke-width="3" stroke-linecap="round"/>
<polygon points="910,570 906.4,556.5 919.9,560.1" fill="#2dd4c6"/>
<rect x="920" y="545" width="182" height="50" fill="#10283f" rx="15" stroke="#2dd4c6" stroke-width="2"/>
<text x="1011" y="575" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">EXECUTE</text>
<line x1="1102" y1="570" x2="1079" y2="308" stroke="#5ea8ff" stroke-width="3" stroke-linecap="round"/>
<polygon points="1078,300 1086.0,311.5 1072.1,312.7" fill="#5ea8ff"/>
<rect x="1088" y="275" width="184" height="50" fill="#10283f" rx="15" stroke="#5ea8ff" stroke-width="2"/>
<text x="1180" y="305" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">APPEND RESULT</text>
<line x1="1272" y1="300" x2="1250" y2="382" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
<polygon points="1248,390 1244.4,376.5 1257.9,380.1" fill="#a78bfa"/>
<rect x="1258" y="365" width="150" height="50" fill="#10283f" rx="15" stroke="#a78bfa" stroke-width="2"/>
<text x="1333" y="395" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">CONTINUE</text>
<line x1="1408" y1="390" x2="1385" y2="652" stroke="#43df88" stroke-width="3" stroke-linecap="round"/>
<polygon points="1384,660 1378.1,647.3 1392.0,648.5" fill="#43df88"/>
<rect x="1394" y="635" width="130" height="50" fill="#10283f" rx="15" stroke="#43df88" stroke-width="2"/>
<text x="1459" y="665" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">VALIDATE</text>
<rect x="340" y="722" width="920" height="74" fill="#351a25" rx="20" stroke="#ff6b81" stroke-width="2"/>
<text x="800" y="767" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">MODEL PROPOSAL != TOOL EXECUTION</text>
<line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="874" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Conceptual observability diagram  |  no live-result claims  |  control-flow trace only</text>
<text x="1528" y="875" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end">chat-deep.ai</text>
</svg>
