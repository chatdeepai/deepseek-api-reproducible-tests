  <rect x="72" y="228" width="1456" height="3" rx="1.5" fill="url(#accentGradient)" opacity="0.9"/><rect x="72" y="292" width="700" height="420" rx="26" fill="#10243a" stroke="#60a5fa" stroke-width="2" opacity="1"/><text x="106" y="342" fill="#60a5fa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850" text-anchor="start" letter-spacing="0" opacity="1">PYTHON</text><rect x="102" y="374" width="640" height="218" rx="18" fill="#081724" stroke="#294864" stroke-width="1.5" opacity="1"/><text x="126" y="416" fill="#60a5fa" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">client = OpenAI(</text><text x="126" y="450" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">  api_key=os.environ[&quot;DEEPSEEK_API_KEY&quot;],</text><text x="126" y="484" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">  base_url=&quot;https://api.deepseek.com&quot;,</text><text x="126" y="518" fill="#60a5fa" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">)</text><circle cx="122" cy="622" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="122" y="629" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="148" y="630" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">credential read from environment</text><circle cx="122" cy="656" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="122" y="663" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="148" y="664" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">custom API origin set explicitly</text><circle cx="122" cy="690" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="122" y="697" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="148" y="698" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">provider model selected at runtime</text><rect x="828" y="292" width="700" height="420" rx="26" fill="#10243a" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="862" y="342" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850" text-anchor="start" letter-spacing="0" opacity="1">NODE.JS</text><rect x="858" y="374" width="640" height="218" rx="18" fill="#081724" stroke="#294864" stroke-width="1.5" opacity="1"/><text x="882" y="416" fill="#a78bfa" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">const client = new OpenAI({</text><text x="882" y="450" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">  apiKey: process.env.DEEPSEEK_API_KEY,</text><text x="882" y="484" fill="#f8fafc" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">  baseURL: &quot;https://api.deepseek.com&quot;,</text><text x="882" y="518" fill="#a78bfa" font-family="Cascadia Mono, Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">});</text><circle cx="878" cy="622" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="878" y="629" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="904" y="630" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">credential read from environment</text><circle cx="878" cy="656" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="878" y="663" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="904" y="664" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">custom API origin set explicitly</text><circle cx="878" cy="690" r="11" fill="#4ade80" stroke="#07111f" stroke-width="0"/><text x="878" y="697" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text><text x="904" y="698" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">provider model selected at runtime</text><rect x="260" y="748" width="1080" height="62" rx="18" fill="#351a25" stroke="#fb7185" stroke-width="2" opacity="1"/><text x="800" y="788" fill="#fb7185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">Server-side only: never ship the credential in browser or mobile code.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#294864" stroke-width="2" opacity="1"/>
