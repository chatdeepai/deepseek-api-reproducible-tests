  <text x="72" y="201" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Choose the client that matches the program’s execution model—not a speed promise</text>
  <rect x="72" y="228" width="1456" height="3" rx="1.5" fill="url(#accentGradient)"/><rect x="72" y="282" width="700" height="416" rx="26" fill="#10283f" stroke="#5ea8ff" stroke-width="2" opacity="1"/><text x="108" y="334" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="880" text-anchor="start" letter-spacing="0" opacity="1">SYNCHRONOUS CLIENT</text><text x="108" y="377" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="820" text-anchor="start" letter-spacing="0.6" opacity="1">BEST FIT</text><rect x="108" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/><text x="200" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">CLI</text><rect x="312" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/><text x="404" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">script</text><rect x="516" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/><text x="608" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">serial worker</text><text x="108" y="482" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="820" text-anchor="start" letter-spacing="0.6" opacity="1">EXECUTION RULES</text><circle cx="120" cy="519" r="11" fill="#5ea8ff" stroke="#071524" stroke-width="0"/>
  <text x="120" y="524" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
