  <rect x="88" y="766" width="1424" height="70" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="126" y="796" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="850" fill="#9a3412">The word-only run passed the exact schema, but reference facts were wrong: 0/1.</text>
  <text x="126" y="823" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#7c2d12">Example-only and neither returned HTTP 400 before completion content; this is one bounded, dated run.</text>
  <text x="88" y="879" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC</text>
  <text x="1512" y="879" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#1d4ed8">LIVE OBSERVATION · MILLISECONDS</text>
