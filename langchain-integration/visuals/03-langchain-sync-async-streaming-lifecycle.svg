<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071524"/>
      <stop offset="100%" stop-color="#0a1b2c"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4c6"/>
      <stop offset="100%" stop-color="#5ea8ff"/>
    </linearGradient>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4c6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffbd22"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <circle cx="1460" cy="-30" r="340" fill="#142d49" opacity="0.55"/>
  <circle cx="25" cy="930" r="340" fill="#0b303c" opacity="0.55"/>
  <rect x="72" y="54" width="600" height="42" rx="21" fill="#0b2b35" stroke="#20707b" stroke-width="1.5" opacity="1"/>
  <text x="94" y="83" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="820" text-anchor="start" letter-spacing="0.5">CHAT-DEEP.AI  |  LANGCHAIN INTEGRATION GUIDE</text>
  <text x="72" y="152" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="850" text-anchor="start" letter-spacing="0">LangChain Sync, Async &amp; Streaming Lifecycle</text>
  <text x="72" y="201" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">Choose the execution method deliberately, validate the terminal state, and propagate cancellation</text>
  <rect x="72" y="228" width="1456" height="3" rx="1.5" fill="url(#accentGradient)"/><rect x="72" y="286" width="456" height="430" rx="24" fill="#10283f" stroke="#5ea8ff" stroke-width="2" opacity="1"/><text x="100" y="330" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="start" letter-spacing="0">SYNCHRONOUS</text><rect x="100" y="354" width="400" height="46" rx="23" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/><text x="300" y="385" fill="#5ea8ff" font-family="Cascadia Mono, Consolas, monospace" font-size="21" font-weight="850" text-anchor="middle" letter-spacing="0">invoke() / stream()</text><circle cx="118" cy="438" r="12" fill="#5ea8ff" stroke="#071524" stroke-width="0"/><text x="118" y="443" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="144" y="446" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">execute in synchronous context</text><circle cx="118" cy="494" r="12" fill="#5ea8ff" stroke="#071524" stroke-width="0"/><text x="118" y="499" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="144" y="502" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">consume each stream item</text><circle cx="118" cy="550" r="12" fill="#5ea8ff" stroke="#071524" stroke-width="0"/><text x="118" y="555" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="144" y="558" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">validate terminal state</text><circle cx="118" cy="606" r="12" fill="#5ea8ff" stroke="#071524" stroke-width="0"/><text x="118" y="611" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="144" y="614" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">close owned resources</text><rect x="100" y="650" width="400" height="44" rx="18" fill="#301e26" stroke="#ff6b81" stroke-width="1.5" opacity="1"/><text x="300" y="679" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle" letter-spacing="0">Do not block an existing event loop.</text><rect x="572" y="286" width="456" height="430" rx="24" fill="#10283f" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="600" y="330" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="start" letter-spacing="0">ASYNCHRONOUS</text><rect x="600" y="354" width="400" height="46" rx="23" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="800" y="385" fill="#a78bfa" font-family="Cascadia Mono, Consolas, monospace" font-size="21" font-weight="850" text-anchor="middle" letter-spacing="0">await ainvoke() / astream()</text><circle cx="618" cy="438" r="12" fill="#a78bfa" stroke="#071524" stroke-width="0"/><text x="618" y="443" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="644" y="446" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">await every operation</text><circle cx="618" cy="494" r="12" fill="#a78bfa" stroke="#071524" stroke-width="0"/><text x="618" y="499" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="644" y="502" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">bound application tasks</text><circle cx="618" cy="550" r="12" fill="#a78bfa" stroke="#071524" stroke-width="0"/><text x="618" y="555" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="644" y="558" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">handle cancellation</text><circle cx="618" cy="606" r="12" fill="#a78bfa" stroke="#071524" stroke-width="0"/><text x="618" y="611" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="644" y="614" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">close with async owner</text><rect x="600" y="650" width="400" height="44" rx="18" fill="#301e26" stroke="#ff6b81" stroke-width="1.5" opacity="1"/><text x="800" y="679" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle" letter-spacing="0">Do not create unbounded coroutines.</text><rect x="1072" y="286" width="456" height="430" rx="24" fill="#10283f" stroke="#2dd4c6" stroke-width="2" opacity="1"/><text x="1100" y="330" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="start" letter-spacing="0">STREAM ASSEMBLY</text><rect x="1100" y="354" width="400" height="46" rx="23" fill="#0b2034" stroke="#2dd4c6" stroke-width="1.5" opacity="1"/><text x="1300" y="385" fill="#2dd4c6" font-family="Cascadia Mono, Consolas, monospace" font-size="21" font-weight="850" text-anchor="middle" letter-spacing="0">route -&gt; assemble -&gt; finish</text><circle cx="1118" cy="438" r="12" fill="#2dd4c6" stroke="#071524" stroke-width="0"/><text x="1118" y="443" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="1144" y="446" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">route allowlisted metadata</text><circle cx="1118" cy="494" r="12" fill="#2dd4c6" stroke="#071524" stroke-width="0"/><text x="1118" y="499" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="1144" y="502" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">merge by choice and tool index</text><circle cx="1118" cy="550" r="12" fill="#2dd4c6" stroke="#071524" stroke-width="0"/><text x="1118" y="555" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="1144" y="558" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">reject incomplete state</text><circle cx="1118" cy="606" r="12" fill="#2dd4c6" stroke="#071524" stroke-width="0"/><text x="1118" y="611" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0">+</text><text x="1144" y="614" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="620" text-anchor="start" letter-spacing="0">validate before use</text><rect x="1100" y="650" width="400" height="44" rx="18" fill="#301e26" stroke="#ff6b81" stroke-width="1.5" opacity="1"/><text x="1300" y="679" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle" letter-spacing="0">Never publish raw deltas or reasoning.</text><rect x="220" y="744" width="1160" height="56" rx="20" fill="#0d2633" stroke="#2dd4c6" stroke-width="2" opacity="1"/><text x="800" y="780" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="720" text-anchor="middle" letter-spacing="0">Cancellation path: stop work -&gt; discard partial state -&gt; close resources -&gt; surface a safe cancellation.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" opacity="1"/>
  <text x="72" y="870" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Conceptual LangChain method diagram  |  no live-result claims  |  lifecycle guidance only</text>
  <text x="1528" y="870" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="780" text-anchor="end" letter-spacing="0">chat-deep.ai</text>
  </svg>