    <text x="790" y="382" font-size="18" font-weight="800" fill="#047857">2 / 2</text>
    <text x="930" y="382" font-size="18" font-weight="800" fill="#047857">2 / 2</text>
    <text x="1055" y="382" font-size="18" font-weight="800" fill="#047857">2/2 · 2/2</text>
