<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Valid JSON versus schema-valid data</title>
  <desc id="desc">Local validation example showing that syntactically valid JSON can still fail exact keys, types, enums, null handling, or business rules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="17" flood-color="#0b1f3a" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="88" y="58" width="238" height="42" rx="21" fill="#475569"/>
  <text x="207" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.6" fill="#ffffff">LOCAL VALIDATION</text>
  <text x="88" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">Parse success is not schema success</text>
  <text x="88" y="207" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" fill="#41536b">The JSON parser checks syntax; your application checks meaning and shape.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="258" width="596" height="434" rx="30" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="916" y="258" width="596" height="434" rx="30" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="122" y="292" width="168" height="38" rx="19" fill="#047857"/>
    <text x="206" y="318" text-anchor="middle" font-size="17" font-weight="900" letter-spacing="1.4" fill="#ffffff">JSON.parse</text>
    <text x="122" y="377" font-size="35" font-weight="900" fill="#047857">PASS</text>
    <rect x="122" y="410" width="528" height="228" rx="20" fill="#0b1f3a"/>
    <text x="152" y="449" font-size="18" fill="#7dd3fc">{</text>
    <text x="174" y="482" font-size="18" fill="#e2e8f0">"ticket_id": "T-204",</text>
    <text x="174" y="515" font-size="18" fill="#e2e8f0">"issue": "account_access",</text>
    <text x="174" y="548" font-size="18" fill="#fcd34d">"reset_attempts": "3",</text>
    <text x="174" y="581" font-size="18" fill="#e2e8f0">"urgent": true, "priority": "high"</text>
    <text x="152" y="614" font-size="18" fill="#7dd3fc">}</text>

    <path d="M708 475h184" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M876 461l18 14-18 14" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="436" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1.3" fill="#1d4ed8">NEXT GATE</text>

    <rect x="950" y="292" width="232" height="38" rx="19" fill="#be123c"/>
    <text x="1066" y="318" text-anchor="middle" font-size="17" font-weight="900" letter-spacing="1.2" fill="#ffffff">LOCAL SCHEMA</text>
    <text x="950" y="377" font-size="35" font-weight="900" fill="#9f1239">FAIL</text>
    <g transform="translate(950 416)">
      <circle cx="15" cy="15" r="15" fill="#be123c"/>
      <text x="15" y="21" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">×</text>
      <text x="48" y="22" font-size="21" font-weight="750" fill="#0b1f3a">reset_attempts is a string</text>
    </g>
    <g transform="translate(950 477)">
      <circle cx="15" cy="15" r="15" fill="#be123c"/>
      <text x="15" y="21" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">×</text>
      <text x="48" y="22" font-size="21" font-weight="750" fill="#0b1f3a">order_id is missing</text>
    </g>
    <g transform="translate(950 538)">
      <circle cx="15" cy="15" r="15" fill="#be123c"/>
      <text x="15" y="21" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">×</text>
      <text x="48" y="22" font-size="21" font-weight="750" fill="#0b1f3a">priority is an extra key</text>
    </g>
    <g transform="translate(950 599)">
      <circle cx="15" cy="15" r="15" fill="#be123c"/>
      <text x="15" y="21" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">×</text>
      <text x="48" y="22" font-size="21" font-weight="750" fill="#0b1f3a">Exact key set is wrong</text>
    </g>
  </g>

  <rect x="88" y="738" width="1424" height="84" rx="20" fill="#eaf3ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="126" y="772" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="850" fill="#0b1f3a">Production rule</text>
  <text x="126" y="802" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#41536b">Do not execute business logic until syntax, top-level type, keys, types, enums, nulls, and reference facts all pass.</text>
  <text x="88" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Deterministic local example · No provider response represented</text>
  <text x="1512" y="872" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">LOCAL VALIDATION</text>
</svg>
