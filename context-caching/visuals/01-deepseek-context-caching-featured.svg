<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Context Caching live test guide</title>
  <desc id="desc">Featured image showing a stable prompt prefix reused by DeepSeek and measured with cache hit and miss token fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#10295b"/>
      <stop offset="1" stop-color="#0b6371"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="95" r="270" fill="#38bdf8" opacity=".08"/>
  <circle cx="150" cy="860" r="340" fill="#34d399" opacity=".08"/>
  <text x="112" y="122" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#7dd3fc" letter-spacing="5">CHAT-DEEP.AI LIVE TEST</text>
  <text x="112" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff">DeepSeek Context Caching</text>
  <text x="112" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="500" fill="#cbd5e1">How cache hits work — measured, not assumed</text>

  <g filter="url(#shadow)">
    <rect x="112" y="365" width="1376" height="378" rx="34" fill="#ffffff" opacity=".98"/>
  </g>
  <text x="168" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#475569">EXACT-EXTENSION CONTROL · SECOND CALL</text>
  <text x="168" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" fill="#0f172a">98.23%</text>
  <text x="492" y="526" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#0f766e">cache-hit rate</text>
  <rect x="168" y="574" width="1210" height="42" rx="21" fill="#e2e8f0"/>
  <rect x="168" y="574" width="1189" height="42" rx="21" fill="url(#bar)"/>
  <rect x="1357" y="574" width="21" height="42" rx="10" fill="#fb7185"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="168" y="676" font-size="25" font-weight="700" fill="#0f172a">6,784 hit tokens</text>
    <text x="454" y="676" font-size="25" font-weight="700" fill="#0f172a">122 miss tokens</text>
    <text x="750" y="676" font-size="25" font-weight="700" fill="#0f172a">96.27% input-cost reduction</text>
    <text x="1240" y="676" font-size="25" font-weight="700" fill="#0f172a">HTTP 200</text>
  </g>
  <text x="112" y="815" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#cbd5e1">deepseek-v4-flash · tested July 27, 2026 UTC · synthetic English data · API key redacted</text>
</svg>
