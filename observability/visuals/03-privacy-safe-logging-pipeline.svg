<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">Privacy-Safe DeepSeek Logging Pipeline</title>
<desc id="visual-description">Pipeline from a quarantined raw request and response through an allowlist, redaction gate, bounded-cardinality controls, sampling, retention, access control, and approved signal stores.</desc>
