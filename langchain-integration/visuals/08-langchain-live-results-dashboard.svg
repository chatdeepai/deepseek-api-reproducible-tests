  <line x1="72" y1="840" x2="1528" y2="840" stroke="#284d68" stroke-width="2"/>
  <text x="72" y="875" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Study elapsed, not a benchmark. Structural success is not semantic quality or an SLA.</text>
  <text x="1528" y="875" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="780" text-anchor="end">chat-deep.ai</text>
