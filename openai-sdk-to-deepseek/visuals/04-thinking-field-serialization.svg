 Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">• no secret or prompt captured</text><rect x="180" y="630" width="1240" height="174" rx="24" fill="#10243a" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="220" y="671" fill="#fbbf24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="start" letter-spacing="0.5" opacity="1">RESPONSE-HANDLING METHOD</text><text x="220" y="713" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Record field presence—not reasoning text.</text><text x="220" y="744" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Preserve the complete assistant message when replay rules apply.</text><text x="220" y="783" fill="#adc1d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="560" text-anchor="start" letter-spacing="0" opacity="1">Live results are summarized in the tested compatibility matrix.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#294864" stroke-width="2" opacity="1"/>
