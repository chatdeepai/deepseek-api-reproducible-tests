<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek JSON Output prompt ablation live observations</title>
  <desc id="desc">Dated live observations comparing a strong JSON prompt, the word json without an example, an example without the word, and neither, with HTTP, content, parse, schema, facts, token, and timing results.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f7faff"/>
  <rect x="0" y="0" width="1600" height="14" fill="#06b6d4"/>
  <rect x="88" y="58" width="250" height="42" rx="21" fill="#06b6d4"/>
  <text x="213" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#06243a">LIVE OBSERVATION</text>
  <text x="88" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">What changes when prompt controls disappear?</text>
  <text x="88" y="207" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" fill="#41536b">V4 Flash · thinking disabled · explicit json_object response format</text>

