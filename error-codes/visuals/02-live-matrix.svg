<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Selected DeepSeek API live status matrix</title>
  <desc id="desc">A dated matrix of a successful control and selected live error responses from a bounded DeepSeek API test.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f6f9fd"/>
  <rect x="0" y="0" width="1600" height="235" fill="url(#header)"/>
  <rect x="88" y="64" width="66" height="10" rx="5" fill="#2563eb"/>
  <text x="88" y="124" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850" fill="#0b1f3a">What the live API returned</text>
  <text x="88" y="171" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#41536b">Selected evidence from 18 sequential requests across 15 scenarios</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(1030 57)">
      <rect width="142" height="112" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="71" y="48" text-anchor="middle" font-size="35" font-weight="850" fill="#1d4ed8">18</text>
      <text x="71" y="81" text-anchor="middle" font-size="17" font-weight="700" fill="#41536b">REQUESTS</text>
    </g>
    <g transform="translate(1190 57)">
      <rect width="142" height="112" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="71" y="48" text-anchor="middle" font-size="35" font-weight="850" fill="#1d4ed8">15</text>
      <text x="71" y="81" text-anchor="middle" font-size="17" font-weight="700" fill="#41536b">SCENARIOS</text>
    </g>
    <g transform="translate(1350 57)">
      <rect width="162" height="112" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
      <text x="81" y="48" text-anchor="middle" font-size="35" font-weight="850" fill="#047857">0</text>
      <text x="81" y="81" text-anchor="middle" font-size="17" font-weight="700" fill="#41536b">AUTO-RETRIES</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="88" y="252" width="1424" height="548" rx="28" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>
  <rect x="88" y="252" width="1424" height="70" rx="28" fill="#0b1f3a"/>
  <rect x="88" y="294" width="1424" height="28" fill="#0b1f3a"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
    <text x="126" y="296">SCENARIO</text>
    <text x="744" y="296">HTTP</text>
    <text x="862" y="296">LATENCY</text>
    <text x="1002" y="296">RESPONSE TYPE</text>
    <text x="1310" y="296">RESULT</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="322" width="1424" height="66" fill="#f0fdf4"/>
    <text x="126" y="363" font-size="21" font-weight="750" fill="#0b1f3a">Known-good control · POST /chat/completions</text>
    <rect x="730" y="336" width="82" height="38" rx="19" fill="#047857"/>
    <text x="771" y="362" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">200</text>
    <text x="862" y="363" font-size="21" fill="#334155">1,050 ms</text>
    <text x="1002" y="363" font-size="20" fill="#334155">application/json</text>
    <text x="1310" y="363" font-size="20" font-weight="750" fill="#047857">OK.</text>

    <rect x="88" y="388" width="1424" height="66" fill="#ffffff"/>
    <text x="126" y="429" font-size="21" font-weight="750" fill="#0b1f3a">Synthetic invalid credential</text>
    <rect x="730" y="402" width="82" height="38" rx="19" fill="#be123c"/>
    <text x="771" y="428" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">401</text>
    <text x="862" y="429" font-size="21" fill="#334155">298 ms</text>
    <text x="1002" y="429" font-size="20" fill="#334155">application/json</text>
    <text x="1310" y="429" font-size="20" font-weight="750" fill="#9f1239">JSON error</text>

    <rect x="88" y="454" width="1424" height="66" fill="#f8fafc"/>
    <text x="126" y="495" font-size="21" font-weight="750" fill="#0b1f3a">Malformed JSON body</text>
    <rect x="730" y="468" width="82" height="38" rx="19" fill="#be123c"/>
    <text x="771" y="494" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">400</text>
    <text x="862" y="495" font-size="21" fill="#334155">282 ms</text>
    <text x="1002" y="495" font-size="20" fill="#334155">application/octet-stream</text>
    <text x="1310" y="495" font-size="20" font-weight="750" fill="#9f1239">No JSON</text>

    <rect x="88" y="520" width="1424" height="66" fill="#ffffff"/>
    <text x="126" y="561" font-size="21" font-weight="750" fill="#0b1f3a">Synthetic nonexistent model ID</text>
    <rect x="730" y="534" width="82" height="38" rx="19" fill="#be123c"/>
    <text x="771" y="560" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">400</text>
    <text x="862" y="561" font-size="21" fill="#334155">266 ms</text>
    <text x="1002" y="561" font-size="20" fill="#334155">application/octet-stream</text>
    <text x="1310" y="561" font-size="20" font-weight="750" fill="#9f1239">Validation</text>

    <rect x="88" y="586" width="1424" height="66" fill="#f8fafc"/>
    <text x="126" y="627" font-size="21" font-weight="750" fill="#0b1f3a">Wrong route · POST /chat/completion</text>
    <rect x="730" y="600" width="82" height="38" rx="19" fill="#475569"/>
    <text x="771" y="626" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">404</text>
    <text x="862" y="627" font-size="21" fill="#334155">266 ms</text>
    <text x="1002" y="627" font-size="20" fill="#334155">No type</text>
    <text x="1310" y="627" font-size="20" font-weight="750" fill="#475569">Empty body</text>

    <rect x="88" y="652" width="1424" height="66" fill="#ffffff"/>
    <text x="126" y="693" font-size="21" font-weight="750" fill="#0b1f3a">Wrong method · GET /chat/completions</text>
    <rect x="730" y="666" width="82" height="38" rx="19" fill="#475569"/>
    <text x="771" y="692" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">405</text>
    <text x="862" y="693" font-size="21" fill="#334155">274 ms</text>
    <text x="1002" y="693" font-size="20" fill="#334155">No type</text>
    <text x="1310" y="693" font-size="20" font-weight="750" fill="#475569">Empty body</text>

    <rect x="88" y="718" width="1424" height="66" fill="#f8fafc"/>
    <text x="126" y="759" font-size="21" font-weight="750" fill="#0b1f3a">JSON text sent as text/plain</text>
    <rect x="730" y="732" width="82" height="38" rx="19" fill="#475569"/>
    <text x="771" y="758" text-anchor="middle" font-size="20" font-weight="850" fill="#ffffff">415</text>
    <text x="862" y="759" font-size="21" fill="#334155">277 ms</text>
    <text x="1002" y="759" font-size="20" fill="#334155">text/plain</text>
    <text x="1310" y="759" font-size="20" font-weight="750" fill="#475569">Media type</text>
  </g>

  <text x="88" y="850" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC · Selected rows; synthetic inputs; no automatic retries</text>
  <text x="1512" y="850" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1d4ed8">LIVE API EVIDENCE</text>
</svg>
