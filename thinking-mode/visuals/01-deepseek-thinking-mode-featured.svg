    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="280" fill="#38bdf8" opacity=".08"/>
  <circle cx="120" cy="860" r="330" fill="#34d399" opacity=".08"/>
