  <text x="120" y="569" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
  <text x="146" y="571" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start" letter-spacing="0" opacity="1">reuse inside one clear owner</text><circle cx="120" cy="609" r="11" fill="#5ea8ff" stroke="#071524" stroke-width="0"/>
  <text x="120" y="614" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
  <text x="146" y="616" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start" letter-spacing="0" opacity="1">close when the owner shuts down</text><rect x="108" y="632" width="628" height="46" rx="18" fill="#301e26" stroke="#ff6b81" stroke-width="1.5" opacity="1"/><text x="422" y="662" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" letter-spacing="0" opacity="1">Do not run blocking network calls on an event loop.</text><rect x="828" y="282" width="700" height="416" rx="26" fill="#10283f" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="864" y="334" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="880" text-anchor="start" letter-spacing="0" opacity="1">ASYNCHRONOUS CLIENT</text><text x="864" y="377" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="820" text-anchor="start" letter-spacing="0.6" opacity="1">BEST FIT</text><rect x="864" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="956" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">ASGI app</text><rect x="1068" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="1160" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">async worker</text><rect x="1272" y="395" width="184" height="42" rx="21" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="1364" y="423" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="690" text-anchor="middle" letter-spacing="0" opacity="1">event-loop service</text><text x="864" y="482" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="820" text-anchor="start" letter-spacing="0.6" opacity="1">EXECUTION RULES</text><circle cx="876" cy="519" r="11" fill="#a78bfa" stroke="#071524" stroke-width="0"/>
  <text x="876" y="524" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
  <text x="902" y="526" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start" letter-spacing="0" opacity="1">await every network operation</text><circle cx="876" cy="564" r="11" fill="#a78bfa" stroke="#071524" stroke-width="0"/>
  <text x="876" y="569" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
  <text x="902" y="571" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start" letter-spacing="0" opacity="1">bound concurrent application tasks</text><circle cx="876" cy="609" r="11" fill="#a78bfa" stroke="#071524" stroke-width="0"/>
  <text x="876" y="614" fill="#061422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0" opacity="1">✓</text>
  <text x="902" y="616" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start" letter-spacing="0" opacity="1">close with the async owner</text><rect x="864" y="632" width="628" height="46" rx="18" fill="#301e26" stroke="#ff6b81" stroke-width="1.5" opacity="1"/><text x="1178" y="662" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" letter-spacing="0" opacity="1">Do not create a fresh client for every coroutine.</text><rect x="220" y="730" width="1160" height="70" rx="22" fill="#0d2633" stroke="#2dd4c6" stroke-width="2" opacity="1"/><text x="800" y="774" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="760" text-anchor="middle" letter-spacing="0" opacity="1">Already inside an event loop? Use async. Otherwise choose the simpler ownership model.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" opacity="1"/>
