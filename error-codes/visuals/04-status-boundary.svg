<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek 400 versus 422 evidence boundary</title>
  <desc id="desc">Official definitions for 400 and 422 alongside the bounded live observation that several invalid requests returned 400 and no 422 was observed.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f7faff"/>
  <rect x="0" y="0" width="1600" height="16" fill="#2563eb"/>
  <text x="88" y="93" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#2563eb">DOCUMENTATION VS DATED OBSERVATION</text>
  <text x="88" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">Where is the 400 / 422 boundary?</text>
  <text x="88" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">The official labels are clear; the live boundary was not universal in this bounded matrix.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="256" width="438" height="244" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1074" y="256" width="438" height="244" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="118" y="286" width="112" height="62" rx="31" fill="#1d4ed8"/>
    <text x="174" y="328" text-anchor="middle" font-size="30" font-weight="850" fill="#ffffff">400</text>
    <text x="254" y="326" font-size="27" font-weight="850" fill="#0b1f3a">Invalid Format</text>
    <text x="118" y="393" font-size="20" font-weight="750" fill="#64748b">OFFICIAL DEFINITION</text>
    <text x="118" y="433" font-size="24" font-weight="650" fill="#0b1f3a">Request body format is invalid.</text>
    <text x="118" y="466" font-size="18" fill="#41536b">Correct the request before resending.</text>

    <rect x="1104" y="286" width="112" height="62" rx="31" fill="#1d4ed8"/>
    <text x="1160" y="328" text-anchor="middle" font-size="30" font-weight="850" fill="#ffffff">422</text>
    <text x="1240" y="326" font-size="27" font-weight="850" fill="#0b1f3a">Invalid Parameters</text>
    <text x="1104" y="393" font-size="20" font-weight="750" fill="#64748b">OFFICIAL DEFINITION</text>
    <text x="1104" y="433" font-size="24" font-weight="650" fill="#0b1f3a">Request parameters are invalid.</text>
    <text x="1104" y="466" font-size="18" fill="#41536b">Correct the parameters before resending.</text>

    <path d="M549 378h118" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
    <path d="M933 378h118" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
    <circle cx="800" cy="378" r="126" fill="#eaf3ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="800" y="340" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2" fill="#1d4ed8">LIVE RESULT</text>
    <text x="800" y="394" text-anchor="middle" font-size="46" font-weight="900" fill="#0b1f3a">400</text>
    <text x="800" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#41536b">for all examples below</text>
  </g>

  <rect x="88" y="546" width="1424" height="178" rx="26" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  <text x="126" y="588" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2" fill="#64748b">OBSERVED INVALID EXAMPLES</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(126 614)">
      <rect width="310" height="72" rx="18" fill="#f8fafc"/>
      <circle cx="35" cy="36" r="16" fill="#be123c"/>
      <text x="35" y="43" text-anchor="middle" font-size="15" font-weight="850" fill="#ffffff">400</text>
      <text x="65" y="43" font-size="20" font-weight="750" fill="#0b1f3a">Invalid model ID</text>
    </g>
    <g transform="translate(462 614)">
      <rect width="310" height="72" rx="18" fill="#f8fafc"/>
      <circle cx="35" cy="36" r="16" fill="#be123c"/>
      <text x="35" y="43" text-anchor="middle" font-size="15" font-weight="850" fill="#ffffff">400</text>
      <text x="65" y="43" font-size="20" font-weight="750" fill="#0b1f3a">Temperature = 3</text>
    </g>
    <g transform="translate(798 614)">
      <rect width="310" height="72" rx="18" fill="#f8fafc"/>
      <circle cx="35" cy="36" r="16" fill="#be123c"/>
      <text x="35" y="43" text-anchor="middle" font-size="15" font-weight="850" fill="#ffffff">400</text>
      <text x="65" y="43" font-size="20" font-weight="750" fill="#0b1f3a">Wrong message shape</text>
    </g>
    <g transform="translate(1134 614)">
      <rect width="340" height="72" rx="18" fill="#f8fafc"/>
      <circle cx="35" cy="36" r="16" fill="#be123c"/>
      <text x="35" y="43" text-anchor="middle" font-size="15" font-weight="850" fill="#ffffff">400</text>
      <text x="65" y="43" font-size="20" font-weight="750" fill="#0b1f3a">user_id length 513</text>
    </g>
  </g>

  <rect x="88" y="756" width="1424" height="76" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <path d="M125 798l17-30 17 30z" fill="#c2410c"/>
  <rect x="140" y="779" width="4" height="10" rx="2" fill="#ffffff"/>
  <circle cx="142" cy="794" r="2.5" fill="#ffffff"/>
  <text x="180" y="791" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="850" fill="#9a3412">422 not observed in this bounded matrix.</text>
  <text x="180" y="818" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#7c2d12">This does not mean the API never returns 422; branch on the real HTTP status your client receives.</text>
  <text x="88" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC</text>
  <text x="1512" y="872" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">OFFICIAL LABELS + LIVE API EVIDENCE</text>
</svg>
