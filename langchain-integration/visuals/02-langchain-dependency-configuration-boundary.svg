" opacity="1"/><text x="648" y="477" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">API origin  |  model policy</text><rect x="624" y="512" width="352" height="48" rx="16" fill="#0b2034" stroke="#284d68" stroke-width="1.3" opacity="1"/><text x="648" y="543" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">timeout  |  retry policy</text><rect x="1108" y="300" width="420" height="330" rx="24" fill="#10283f" stroke="#2dd4c6" stroke-width="2" opacity="1"/><text x="1318" y="348" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="850" text-anchor="middle" letter-spacing="0">ADAPTER FACTORY</text><rect x="1142" y="380" width="352" height="48" rx="16" fill="#0b2034" stroke="#284d68" stroke-width="1.3" opacity="1"/><text x="1166" y="411" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">owned chat-model adapter</text><rect x="1142" y="446" width="352" height="48" rx="16" fill="#0b2034" stroke="#284d68" stroke-width="1.3" opacity="1"/><text x="1166" y="477" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">allowlisted callbacks</text><rect x="1142" y="512" width="352" height="48" rx="16" fill="#0b2034" stroke="#284d68" stroke-width="1.3" opacity="1"/><text x="1166" y="543" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">injected runnable</text><line x1="492" y1="465" x2="574" y2="465" stroke="#2dd4c6" stroke-width="5" opacity="1" marker-end="url(#arrowTeal)"/><line x1="1010" y1="465" x2="1092" y2="465" stroke="#2dd4c6" stroke-width="5" opacity="1" marker-end="url(#arrowTeal)"/><rect x="210" y="672" width="11