<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sequential versus concurrent DeepSeek request timing</title>
  <desc id="desc">Live comparison of four sequential DeepSeek requests taking 4,061 milliseconds and four requests with an application concurrency cap of four taking 1,106 milliseconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="88" y="60" width="88" height="38" rx="19" fill="#0e7490"/>
  <text x="132" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#ffffff">LIVE</text>
  <text x="88" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="850" fill="#0b1f3a">Same four requests, different scheduling</text>
  <text x="88" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">An application cap changes wall time without changing the provider’s documented account limit.</text>

  <rect x="88" y="266" width="1424" height="226" rx="28" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  <text x="126" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850" fill="#0b1f3a">SEQUENTIAL · CAP 1</text>
  <text x="1474" y="316" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#475569">4,061 ms total</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="126" y="350" width="330" height="86" rx="18" fill="#dbe3ed"/>
    <rect x="466" y="350" width="330" height="86" rx="18" fill="#cbd5e1"/>
    <rect x="806" y="350" width="330" height="86" rx="18" fill="#b9c7d8"/>
    <rect x="1146" y="350" width="328" height="86" rx="18" fill="#a8b8ca"/>
    <g font-size="21" font-weight="850" fill="#0b1f3a">
      <text x="291" y="403" text-anchor="middle">REQUEST 1</text>
      <text x="631" y="403" text-anchor="middle">REQUEST 2</text>
      <text x="971" y="403" text-anchor="middle">REQUEST 3</text>
      <text x="1310" y="403" text-anchor="middle">REQUEST 4</text>
    </g>
    <text x="126" y="465" font-size="17" fill="#64748b">One starts after the previous request finishes</text>
  </g>

  <rect x="88" y="532" width="1424" height="226" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="126" y="582" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850" fill="#0b1f3a">CONCURRENT · APP CAP 4</text>
  <text x="1474" y="582" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#1d4ed8">1,106 ms total</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="126" y="616" width="1348" height="82" rx="20" fill="#eaf3ff"/>
    <rect x="126" y="616" width="1090" height="16" rx="8" fill="url(#fast)"/>
    <g transform="translate(150 648)">
      <rect width="280" height="34" rx="14" fill="#2563eb"/>
      <text x="140" y="24" text-anchor="middle" font-size="18" font-weight="850" fill="#ffffff">REQUEST 1</text>
    </g>
    <g transform="translate(444 648)">
      <rect width="280" height="34" rx="14" fill="#1d76c7"/>
      <text x="140" y="24" text-anchor="middle" font-size="18" font-weight="850" fill="#ffffff">REQUEST 2</text>
    </g>
    <g transform="translate(738 648)">
      <rect width="280" height="34" rx="14" fill="#138fc0"/>
      <text x="140" y="24" text-anchor="middle" font-size="18" font-weight="850" fill="#ffffff">REQUEST 3</text>
    </g>
    <g transform="translate(1032 648)">
      <rect width="280" height="34" rx="14" fill="#089fb4"/>
      <text x="140" y="24" text-anchor="middle" font-size="18" font-weight="850" fill="#ffffff">REQUEST 4</text>
    </g>
    <text x="126" y="730" font-size="17" fill="#41536b">All four begin inside the application-controlled window</text>
  </g>

  <rect x="88" y="796" width="1424" height="2" fill="#dbe7f3"/>
  <text x="88" y="846" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC · 4/4 succeeded in each timing pair · HTTP 429 not observed</text>
  <text x="1512" y="846" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1d4ed8">LIVE API EVIDENCE</text>
</svg>
