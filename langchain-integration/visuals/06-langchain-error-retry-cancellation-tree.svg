  <text x="72" y="152" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="850" text-anchor="start" letter-spacing="0">LangChain Error, Retry &amp; Cancellation Tree</text>
  <text x="72" y="201" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">Classify the failing layer before fixing, retrying, rejecting, or propagating cancellation</text>
  <rect x="72" y="228" width="1456" height="3" rx="1.5" fill="url(#accentGradient)"/><rect x="180" y="286" width="1240" height="150" rx="24" fill="#10283f" stroke="#5ea8ff" stroke-width="2" opacity="1"/><text x="220" y="334" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850" text-anchor="start" letter-spacing="0">FAILURE CONTEXT</text><rect x="220" y="365" width="210" height="44" rx="22" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/><text x="325" y="395" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">LAYER</text><rect x="450" y="365" width="210" height="44" rx="22" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="555" y="395" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">REQUEST SENT?</text><rect x="680" y="365" width="210" height="44" rx="22" fill="#0b2034" stroke="#2dd4c6" stroke-width="1.5" opacity="1"/><text x="785" y="395" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">SIDE EFFECT?</text><rect x="910" y="365" width="210" height="44" rx="22" fill="#0b2034" stroke="#43df88" stroke-width="1.5" opacity="1"/><text x="1015" y="395" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">IDEMPOTENT?</text><rect x="1140" y="365" width="210" height="44" rx="22" fill="#0b2034" stroke="#ffbd22" stroke-width="1.5" opacity="1"/><text x="1245" y="395" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">CANCELLED?</text><path d="M775 438 L825 438 L800 488 Z" fill="#2dd4c6"/><rect x="72" y="500" width="276" height="220" rx="22" fill="#10283f" stroke="#ff6b81" stroke-width="2" opacity="1"/>
  <text x="210" y="550" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0">CONFIGURATION</text>
