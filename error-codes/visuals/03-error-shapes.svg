<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek API error response shapes</title>
  <desc id="desc">Comparison of a JSON 401 response, a non-JSON 401 response, and an opaque 400 response, emphasizing that the JSON error code field is not the HTTP status.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f7ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <text x="88" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#2563eb">ONE ENDPOINT, MULTIPLE ERROR SHAPES</text>
  <text x="88" y="159" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">Do not assume every failure is JSON</text>
  <text x="88" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" fill="#41536b">Read the HTTP status first, then inspect the response type before parsing.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="258" width="440" height="424" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="580" y="258" width="440" height="424" rx="26" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
    <rect x="1072" y="258" width="440" height="424" rx="26" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="258" width="440" height="78" rx="26" fill="#eff6ff"/>
    <rect x="88" y="310" width="440" height="26" fill="#eff6ff"/>
    <circle cx="132" cy="297" r="21" fill="#2563eb"/>
    <text x="132" y="305" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">1</text>
    <text x="169" y="305" font-size="23" font-weight="800" fill="#1e3a8a">Synthetic invalid credential</text>

    <text x="122" y="383" font-size="18" font-weight="750" fill="#64748b">HTTP STATUS</text>
    <text x="122" y="432" font-size="42" font-weight="850" fill="#9f1239">401</text>
    <text x="250" y="383" font-size="18" font-weight="750" fill="#64748b">RESPONSE TYPE</text>
    <text x="250" y="425" font-size="20" font-weight="750" fill="#0b1f3a">application/json</text>
    <rect x="122" y="466" width="372" height="166" rx="18" fill="#0b1f3a"/>
    <text x="146" y="501" font-size="17" font-weight="700" fill="#7dd3fc">{</text>
    <text x="162" y="532" font-size="17" fill="#e2e8f0">"type": "authentication_error",</text>
    <text x="162" y="563" font-size="17" fill="#e2e8f0">"code": "invalid_request_error",</text>
    <text x="162" y="594" font-size="17" fill="#e2e8f0">"message": "Authentication fails"</text>
    <text x="146" y="621" font-size="17" font-weight="700" fill="#7dd3fc">}</text>

    <rect x="580" y="258" width="440" height="78" rx="26" fill="#f8fafc"/>
    <rect x="580" y="310" width="440" height="26" fill="#f8fafc"/>
    <circle cx="624" cy="297" r="21" fill="#475569"/>
    <text x="624" y="305" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">2</text>
    <text x="661" y="305" font-size="23" font-weight="800" fill="#0b1f3a">Credential omitted</text>
    <text x="614" y="383" font-size="18" font-weight="750" fill="#64748b">HTTP STATUS</text>
    <text x="614" y="432" font-size="42" font-weight="850" fill="#9f1239">401</text>
    <text x="742" y="383" font-size="18" font-weight="750" fill="#64748b">RESPONSE TYPE</text>
    <text x="742" y="425" font-size="20" font-weight="750" fill="#0b1f3a">Not supplied</text>
    <rect x="614" y="466" width="372" height="166" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="800" y="526" text-anchor="middle" font-size="26" font-weight="800" fill="#475569">No JSON error object</text>
    <text x="800" y="566" text-anchor="middle" font-size="20" fill="#64748b">31 response bytes</text>
    <text x="800" y="599" text-anchor="middle" font-size="18" fill="#64748b">Safe text fallback required</text>

    <rect x="1072" y="258" width="440" height="78" rx="26" fill="#f8fafc"/>
    <rect x="1072" y="310" width="440" height="26" fill="#f8fafc"/>
    <circle cx="1116" cy="297" r="21" fill="#475569"/>
    <text x="1116" y="305" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">3</text>
    <text x="1153" y="305" font-size="23" font-weight="800" fill="#0b1f3a">Malformed JSON</text>
    <text x="1106" y="383" font-size="18" font-weight="750" fill="#64748b">HTTP STATUS</text>
    <text x="1106" y="432" font-size="42" font-weight="850" fill="#9f1239">400</text>
    <text x="1234" y="383" font-size="18" font-weight="750" fill="#64748b">RESPONSE TYPE</text>
    <text x="1234" y="425" font-size="18" font-weight="750" fill="#0b1f3a">application/octet-stream</text>
    <rect x="1106" y="466" width="372" height="166" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1292" y="526" text-anchor="middle" font-size="26" font-weight="800" fill="#475569">Opaque to JSON parser</text>
    <text x="1292" y="566" text-anchor="middle" font-size="20" fill="#64748b">93 response bytes</text>
    <text x="1292" y="599" text-anchor="middle" font-size="18" fill="#64748b">Preserve status + metadata</text>
  </g>

  <rect x="88" y="724" width="1424" height="96" rx="22" fill="#eaf3ff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="132" cy="772" r="24" fill="#1d4ed8"/>
  <text x="132" y="780" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="850" fill="#ffffff">!</text>
  <text x="174" y="765" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="850" fill="#0b1f3a">The JSON field error.code is not the HTTP status.</text>
  <text x="174" y="798" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#41536b">The observed 401 JSON body used the string “invalid_request_error”; route retries by numeric status and context.</text>
  <text x="88" y="862" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC</text>
  <text x="1512" y="862" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1d4ed8">LIVE API EVIDENCE</text>
</svg>
