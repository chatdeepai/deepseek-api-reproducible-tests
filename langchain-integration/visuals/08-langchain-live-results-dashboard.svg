<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek and LangChain live results dashboard</title>
  <desc id="desc">Sanitized dated observations from a bounded LangChain integration study completed on 2026-07-27 UTC.</desc>
  <defs>
