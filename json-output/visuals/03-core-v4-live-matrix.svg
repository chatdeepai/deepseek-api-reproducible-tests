<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 JSON Output live observation matrix</title>
  <desc id="desc">Dated live observations comparing V4 Flash and Pro with thinking disabled and enabled across two repetitions, with explicit denominators for content, parsing, schema, reference facts, and finish reason.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f5f9ff"/>
  <rect x="0" y="0" width="1600" height="218" fill="url(#top)"/>
  <rect x="88" y="50" width="250" height="42" rx="21" fill="#06b6d4"/>
  <text x="213" y="78" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#06243a">LIVE OBSERVATION</text>
  <text x="88" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850" fill="#ffffff">Core V4 JSON Output matrix</text>
  <text x="88" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" fill="#cbd5e1">Two repetitions per model and thinking mode · descriptive evidence only</text>

  <g filter="url(#shadow)">
    <rect x="88" y="252" width="1424" height="484" rx="30" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>
  <rect x="88" y="252" width="1424" height="72" rx="30" fill="#eaf3ff"/>
  <rect x="88" y="294" width="1424" height="30" fill="#eaf3ff"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850" fill="#1e3a8a">
    <text x="126" y="297">MODEL</text>
    <text x="466" y="297">THINKING</text>
    <text x="690" y="297">RUNS</text>
    <text x="820" y="297">NON-EMPTY</text>
    <text x="1010" y="297">PARSE</text>
    <text x="1150" y="297">SCHEMA / FACTS</text>
    <text x="1360" y="297">FINISH</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="324" width="1424" height="94" fill="#ffffff"/>
    <text x="126" y="380" font-size="22" font-weight="850" fill="#0b1f3a">deepseek-v4-flash</text>
    <text x="466" y="380" font-size="21" fill="#41536b">disabled</text>
    <text x="690" y="380" font-size="22" font-weight="850" fill="#0b1f3a">2</text>
    <g font-size="18" font-weight="800" fill="#047857">
      <text x="820" y="380">2 / 2</text><text x="1010" y="380">2 / 2</text><text x="1150" y="380">2 / 2</text><text x="1308" y="380">2 / 2 stop</text>
    </g>
    <rect x="88" y="418" width="1424" height="94" fill="#f8fafc"/>
    <text x="126" y="474" font-size="22" font-weight="850" fill="#0b1f3a">deepseek-v4-flash</text>
    <text x="466" y="474" font-size="21" fill="#41536b">enabled · high</text>
    <text x="690" y="474" font-size="22" font-weight="850" fill="#0b1f3a">2</text>
    <g font-size="18" font-weight="800" fill="#047857">
      <text x="820" y="474">2 / 2</text><text x="1010" y="474">2 / 2</text><text x="1150" y="474">2 / 2</text><text x="1308" y="474">2 / 2 stop</text>
    </g>
    <rect x="88" y="512" width="1424" height="94" fill="#ffffff"/>
    <text x="126" y="568" font-size="22" font-weight="850" fill="#0b1f3a">deepseek-v4-pro</text>
    <text x="466" y="568" font-size="21" fill="#41536b">disabled</text>
    <text x="690" y="568" font-size="22" font-weight="850" fill="#0b1f3a">2</text>
    <g font-size="18" font-weight="800" fill="#047857">
      <text x="820" y="568">2 / 2</text><text x="1010" y="568">2 / 2</text><text x="1150" y="568">2 / 2</text><text x="1308" y="568">2 / 2 stop</text>
    </g>
    <rect x="88" y="606" width="1424" height="94" fill="#f8fafc"/>
    <text x="126" y="662" font-size="22" font-weight="850" fill="#0b1f3a">deepseek-v4-pro</text>
    <text x="466" y="662" font-size="21" fill="#41536b">enabled · high</text>
    <text x="690" y="662" font-size="22" font-weight="850" fill="#0b1f3a">2</text>
    <g font-size="18" font-weight="800" fill="#047857">
      <text x="820" y="662">2 / 2</text><text x="1010" y="662">2 / 2</text><text x="1150" y="662">2 / 2</text><text x="1308" y="662">2 / 2 stop</text>
    </g>
  </g>
  <rect x="88" y="770" width="1424" height="72" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
  <text x="126" y="800" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="850" fill="#065f46">8/8 non-empty · 8/8 parsed · 8/8 schema-valid · 8/8 reference facts correct</text>
  <text x="126" y="827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#41536b">Two repetitions per configuration are descriptive observations, not model reliability rates.</text>
  <text x="88" y="880" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC</text>
  <text x="1512" y="880" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#1d4ed8">8 SEQUENTIAL CALLS · 0 RETRIES</text>
</svg>
