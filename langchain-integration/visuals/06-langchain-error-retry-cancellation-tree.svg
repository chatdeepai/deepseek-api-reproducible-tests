  <text x="210" y="663" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">dependency or option</text><text x="210" y="692" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">no blind retry</text><rect x="370" y="500" width="276" height="220" rx="22" fill="#10283f" stroke="#5ea8ff" stroke-width="2" opacity="1"/>
  <text x="508" y="550" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0">TRANSPORT</text>
  <rect x="410" y="580" width="196" height="44" rx="22" fill="#0b2034" stroke="#5ea8ff" stroke-width="1.5" opacity="1"/>
  <text x="508" y="610" fill="#5ea8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="850" text-anchor="middle" letter-spacing="0">RETRY IF SAFE</text>
  <text x="508" y="663" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">explicitly transient</text><text x="508" y="692" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">bounded policy</text><rect x="668" y="500" width="276" height="220" rx="22" fill="#10283f" stroke="#a78bfa" stroke-width="2" opacity="1"/>
  <text x="806" y="550" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0">PARSER / SCHEMA</text>
  <rect x="708" y="580" width="196" height="44" rx="22" fill="#0b2034" stroke="#a78bfa" stroke-width="1.5" opacity="1"/>
  <text x="806" y="610" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="850" text-anchor="middle" letter-spacing="0">REJECT OR REPAIR</text>
  <text x="806" y="663" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">validate safely</text><text x="806" y="692" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">bounded fallback</text><rect x="966" y="500" width="276" height="220" rx="22" fill="#10283f" stroke="#ffbd22" stroke-width="2" opacity="1"/>
  <text x="1104" y="550" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0">TOOL / AGENT</text>
  <rect x="1006" y="580" width="196" height="44" rx="22" fill="#0b2034" stroke="#ffbd22" stroke-width="1.5" opacity="1"/>
  <text x="1104" y="610" fill="#ffbd22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="850" text-anchor="middle" letter-spacing="0">STOP IF UNSAFE</text>
  <text x="1104" y="663" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">check side effect</text><text x="1104" y="692" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">limit agent turns</text><rect x="1264" y="500" width="276" height="220" rx="22" fill="#10283f" stroke="#43df88" stroke-width="2" opacity="1"/>
  <text x="1402" y="550" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" text-anchor="middle" letter-spacing="0">CANCELLATION</text>
  <rect x="1304" y="580" width="196" height="44" rx="22" fill="#0b2034" stroke="#43df88" stroke-width="1.5" opacity="1"/>
  <text x="1402" y="610" fill="#43df88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="850" text-anchor="middle" letter-spacing="0">PROPAGATE</text>
  <text x="1402" y="663" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">close resources</text><text x="1402" y="692" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0">do not convert to retry</text><rect x="230" y="752" width="1140" height="60" rx="18" fill="#351a25" stroke="#ff6b81" stroke-width="2" opacity="1"/><text x="800" y="790" fill="#ff6b81" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="760" text-anchor="middle" letter-spacing="0">Safe callbacks omit prompts, generations, tool payloads, credentials, headers, trace IDs, and raw errors.</text><line x1="72" y1="828" x2="1528" y2="828" stroke="#284d68" stroke-width="2" opacity="1"/>
  <text x="72" y="870" fill="#afc0d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Conceptual LangChain method diagram  |  no live-result claims  |  failure categories only</text>
  <text x="1528" y="870" fill="#2dd4c6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="780" text-anchor="end" letter-spacing="0">chat-deep.ai</text>
