<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek streaming keep-alive parser evidence</title>
  <desc id="desc">Official transport behavior, a live stream with 341 millisecond time to first body chunk and 756 millisecond total time, and an offline parser fixture handling two split keep-alive comments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="88" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#2563eb">STREAM TRANSPORT EVIDENCE</text>
  <text x="88" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">A parser must survive split keep-alives</text>
  <text x="88" y="206" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">Live timing verifies the path; an offline fixture verifies the edge case.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="254" width="420" height="226" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="544" y="254" width="492" height="226" rx="28" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
    <rect x="1072" y="254" width="440" height="226" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="118" y="280" width="122" height="34" rx="17" fill="#1d4ed8"/>
    <text x="179" y="303" text-anchor="middle" font-size="16" font-weight="900" letter-spacing="1.5" fill="#ffffff">OFFICIAL</text>
    <text x="118" y="356" font-size="24" font-weight="850" fill="#0b1f3a">Streaming transport</text>
    <text x="118" y="395" font-size="20" fill="#41536b">Keep-alive comments may appear</text>
    <text x="118" y="429" font-size="20" fill="#41536b">Data events carry stream payloads</text>
    <text x="118" y="463" font-size="20" fill="#41536b">DONE terminates the stream</text>

    <rect x="574" y="280" width="88" height="34" rx="17" fill="#0e7490"/>
    <text x="618" y="303" text-anchor="middle" font-size="16" font-weight="900" letter-spacing="1.5" fill="#ffffff">LIVE</text>
    <text x="574" y="362" font-size="48" font-weight="900" fill="#0b1f3a">341 ms</text>
    <text x="760" y="354" font-size="18" font-weight="750" fill="#41536b">TIME TO FIRST</text>
    <text x="760" y="379" font-size="18" font-weight="750" fill="#41536b">BODY CHUNK</text>
    <path d="M574 397h430" stroke="#dbe7f3" stroke-width="2"/>
    <text x="574" y="438" font-size="21" font-weight="800" fill="#0e7490">756 ms total</text>
    <text x="758" y="438" font-size="19" fill="#41536b">· 3 data events</text>
    <text x="574" y="468" font-size="18" fill="#41536b">0 keep-alive comments · DONE received</text>

    <rect x="1102" y="280" width="218" height="34" rx="17" fill="#475569"/>
    <text x="1211" y="303" text-anchor="middle" font-size="16" font-weight="900" letter-spacing="1.2" fill="#ffffff">OFFLINE FIXTURE</text>
    <text x="1102" y="362" font-size="48" font-weight="900" fill="#0b1f3a">2</text>
    <text x="1150" y="354" font-size="19" font-weight="750" fill="#41536b">split keep-alive</text>
    <text x="1150" y="381" font-size="19" font-weight="750" fill="#41536b">comments handled</text>
    <path d="M1102 397h380" stroke="#dbe7f3" stroke-width="2"/>
    <text x="1102" y="438" font-size="20" font-weight="800" fill="#0b1f3a">Chunk boundaries varied</text>
    <text x="1102" y="468" font-size="18" fill="#41536b">No provider traffic in this test</text>
  </g>

  <rect x="88" y="528" width="1424" height="254" rx="30" fill="#0b1f3a"/>
  <text x="126" y="571" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#7dd3fc">BUFFERED PARSER FLOW</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(126 608)">
      <rect width="230" height="104" rx="22" fill="#16345d"/>
      <text x="115" y="47" text-anchor="middle" font-size="22" font-weight="850" fill="#ffffff">1 · Buffer chunks</text>
      <text x="115" y="78" text-anchor="middle" font-size="17" fill="#cbd5e1">Keep incomplete lines</text>
    </g>
    <path d="M366 660h60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M414 650l14 10-14 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <g transform="translate(438 608)">
      <rect width="230" height="104" rx="22" fill="#16345d"/>
      <text x="115" y="47" text-anchor="middle" font-size="22" font-weight="850" fill="#ffffff">2 · Frame lines</text>
      <text x="115" y="78" text-anchor="middle" font-size="17" fill="#cbd5e1">Split only on delimiter</text>
    </g>
    <path d="M678 660h60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M726 650l14 10-14 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <g transform="translate(750 608)">
      <rect width="230" height="104" rx="22" fill="#16345d"/>
      <text x="115" y="47" text-anchor="middle" font-size="22" font-weight="850" fill="#ffffff">3 · Ignore comments</text>
      <text x="115" y="78" text-anchor="middle" font-size="17" fill="#cbd5e1">Keep-alive, not JSON</text>
    </g>
    <path d="M990 660h60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M1038 650l14 10-14 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <g transform="translate(1062 608)">
      <rect width="410" height="104" rx="22" fill="#eaf3ff"/>
      <text x="205" y="47" text-anchor="middle" font-size="22" font-weight="850" fill="#0b1f3a">4 · Parse data or finish</text>
      <text x="205" y="78" text-anchor="middle" font-size="17" fill="#41536b">JSON data event · DONE terminator</text>
    </g>
  </g>
  <text x="88" y="845" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Live test and offline parser fixture generated July 27, 2026 UTC</text>
  <text x="1512" y="845" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">LIVE + OFFLINE VERIFIED</text>
</svg>
