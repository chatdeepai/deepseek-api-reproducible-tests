<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Official DeepSeek JSON Output contract</title>
  <desc id="desc">Official DeepSeek JSON Output setup requirements: json_object response format, a JSON instruction, an example, sufficient output tokens, and handling for occasional empty content.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <rect x="0" y="0" width="1600" height="14" fill="#2563eb"/>
  <rect x="88" y="60" width="132" height="42" rx="21" fill="#1d4ed8"/>
  <text x="154" y="88" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="900" letter-spacing="2" fill="#ffffff">OFFICIAL</text>
  <text x="88" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">The JSON Output setup checklist</text>
  <text x="88" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">Current DeepSeek V4 documentation, reviewed July 27, 2026 UTC</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="252" width="1424" height="450" rx="30" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(126 296)">
      <circle cx="28" cy="28" r="28" fill="#1d4ed8"/>
      <text x="28" y="38" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff">1</text>
      <text x="78" y="25" font-size="23" font-weight="850" fill="#0b1f3a">Set the API control</text>
      <rect x="78" y="44" width="476" height="48" rx="14" fill="#0b1f3a"/>
      <text x="316" y="75" text-anchor="middle" font-size="18" font-weight="700" fill="#7dd3fc">response_format: { "type": "json_object" }</text>
    </g>
    <g transform="translate(784 296)">
      <circle cx="28" cy="28" r="28" fill="#1d4ed8"/>
      <text x="28" y="38" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff">2</text>
      <text x="78" y="25" font-size="23" font-weight="850" fill="#0b1f3a">Say json in the prompt</text>
      <text x="78" y="66" font-size="19" fill="#41536b">Use the word in a system or user message.</text>
      <text x="78" y="93" font-size="17" fill="#64748b">Omitting it can produce whitespace until the limit.</text>
    </g>
    <path d="M126 423h1348" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="translate(126 460)">
      <circle cx="28" cy="28" r="28" fill="#0e7490"/>
      <text x="28" y="38" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff">3</text>
      <text x="78" y="25" font-size="23" font-weight="850" fill="#0b1f3a">Show the desired shape</text>
      <text x="78" y="66" font-size="19" fill="#41536b">Provide an example object with the intended keys.</text>
    </g>
    <g transform="translate(784 460)">
      <circle cx="28" cy="28" r="28" fill="#0e7490"/>
      <text x="28" y="38" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff">4</text>
      <text x="78" y="25" font-size="23" font-weight="850" fill="#0b1f3a">Allow enough output tokens</text>
      <text x="78" y="66" font-size="19" fill="#41536b">A length finish can leave JSON incomplete.</text>
    </g>
    <path d="M126 572h1348" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="translate(126 608)">
      <circle cx="28" cy="28" r="28" fill="#475569"/>
      <text x="28" y="38" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff">5</text>
      <text x="78" y="25" font-size="23" font-weight="850" fill="#0b1f3a">Handle empty content</text>
      <text x="78" y="66" font-size="19" fill="#41536b">DeepSeek says it may occur occasionally; modify the prompt and retry safely.</text>
    </g>
  </g>

  <rect x="88" y="746" width="1424" height="80" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <path d="M126 786l17-30 17 30z" fill="#c2410c"/>
  <rect x="141" y="767" width="4" height="10" rx="2" fill="#ffffff"/>
  <circle cx="143" cy="782" r="2.5" fill="#ffffff"/>
  <text x="182" y="781" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#9a3412">Valid JSON does not guarantee your application schema.</text>
  <text x="182" y="810" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#7c2d12">Validate keys, types, enums, nulls, ranges, and business rules locally.</text>
  <text x="88" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#41536b">Official documentation snapshot · July 27, 2026 UTC</text>
  <text x="1512" y="872" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1d4ed8">V4 FLASH + V4 PRO</text>
</svg>
