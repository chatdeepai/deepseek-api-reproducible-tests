<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek rate-limit live test matrix</title>
  <desc id="desc">Live test summary showing 12 of 12 HTTP 200 responses, an application concurrency cap of four, sequential and concurrent timing, and no forced or observed 429.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".11"/>
    </filter>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f5f9ff"/>
  <rect x="0" y="0" width="1600" height="232" fill="url(#top)"/>
  <rect x="88" y="56" width="88" height="38" rx="19" fill="#06b6d4"/>
  <text x="132" y="82" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#06243a">LIVE</text>
  <text x="88" y="153" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="850" fill="#ffffff">Bounded concurrency test</text>
  <text x="88" y="198" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Sequential requests · capped concurrency · tiny synthetic outputs · automatic retries disabled</text>

  <g filter="url(#shadow)">
    <rect x="88" y="270" width="1424" height="474" rx="30" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(126 312)">
      <rect width="300" height="154" rx="24" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
      <text x="30" y="42" font-size="18" font-weight="800" letter-spacing="1.5" fill="#047857">HTTP SUCCESS</text>
      <text x="30" y="105" font-size="52" font-weight="900" fill="#0b1f3a">12 / 12</text>
      <text x="30" y="135" font-size="18" fill="#41536b">All requests returned 200</text>
    </g>
    <g transform="translate(454 312)">
      <rect width="300" height="154" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="30" y="42" font-size="18" font-weight="800" letter-spacing="1.5" fill="#1d4ed8">MAX APP CAP</text>
      <text x="30" y="105" font-size="52" font-weight="900" fill="#0b1f3a">4</text>
      <text x="30" y="135" font-size="18" fill="#41536b">Client-controlled concurrency</text>
    </g>
    <g transform="translate(782 312)">
      <rect width="300" height="154" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="30" y="42" font-size="18" font-weight="800" letter-spacing="1.5" fill="#475569">HTTP 429</text>
      <text x="30" y="98" font-size="39" font-weight="900" fill="#0b1f3a">0 observed</text>
      <text x="30" y="135" font-size="18" fill="#41536b">Not deliberately forced</text>
    </g>
    <g transform="translate(1110 312)">
      <rect width="364" height="154" rx="24" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
      <text x="30" y="42" font-size="18" font-weight="800" letter-spacing="1.5" fill="#0e7490">RETRY BEHAVIOR</text>
      <text x="30" y="98" font-size="39" font-weight="900" fill="#0b1f3a">0 automatic</text>
      <text x="30" y="135" font-size="18" fill="#41536b">Every live result was direct</text>
    </g>

    <text x="126" y="530" font-size="19" font-weight="800" letter-spacing="2" fill="#64748b">FOUR-REQUEST TIMING PAIR</text>
    <rect x="126" y="558" width="650" height="130" rx="22" fill="#f8fafc"/>
    <text x="158" y="597" font-size="22" font-weight="800" fill="#0b1f3a">Sequential · cap 1</text>
    <text x="158" y="653" font-size="42" font-weight="900" fill="#475569">4,061 ms</text>
    <text x="502" y="646" font-size="19" fill="#64748b">4 requests · wall time</text>

    <rect x="824" y="558" width="650" height="130" rx="22" fill="#eaf3ff"/>
    <text x="856" y="597" font-size="22" font-weight="800" fill="#0b1f3a">Concurrent · cap 4</text>
    <text x="856" y="653" font-size="42" font-weight="900" fill="#1d4ed8">1,106 ms</text>
    <text x="1200" y="646" font-size="19" fill="#41536b">4 requests · wall time</text>
  </g>
  <rect x="88" y="779" width="1424" height="2" fill="#dbe7f3"/>
  <text x="88" y="830" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#41536b">Tested July 27, 2026 UTC · This bounded run did not measure the provider ceiling</text>
  <text x="1512" y="830" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1d4ed8">LIVE API EVIDENCE</text>
</svg>
