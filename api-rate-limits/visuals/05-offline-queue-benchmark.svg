<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Offline concurrency queue benchmark</title>
  <desc id="desc">Offline simulation comparing makespan and 95th-percentile queue wait at application concurrency caps of one, two, four, and eight.</desc>
  <defs>
    <linearGradient id="make" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1f3a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f6f9fd"/>
  <rect x="0" y="0" width="1600" height="14" fill="#06b6d4"/>
  <rect x="88" y="56" width="246" height="42" rx="21" fill="#475569"/>
  <text x="211" y="84" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#ffffff">OFFLINE SIMULATION</text>
  <text x="88" y="159" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="850" fill="#0b1f3a">Queue pressure falls as the app cap rises</text>
  <text x="88" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#41536b">Deterministic fixture only—no requests were sent to DeepSeek.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="252" width="1424" height="514" rx="30" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="126" y="304" font-size="18" font-weight="800" letter-spacing="2" fill="#64748b">APP CAP</text>
    <rect x="314" y="281" width="24" height="14" rx="7" fill="#2563eb"/>
    <text x="350" y="295" font-size="18" font-weight="750" fill="#0b1f3a">Total makespan</text>
    <rect x="555" y="281" width="24" height="14" rx="7" fill="#94a3b8"/>
    <text x="591" y="295" font-size="18" font-weight="750" fill="#0b1f3a">p95 queue wait</text>
    <text x="1458" y="295" text-anchor="end" font-size="17" fill="#64748b">Milliseconds</text>

    <text x="126" y="388" font-size="42" font-weight="900" fill="#0b1f3a">1</text>
    <rect x="228" y="344" width="1130" height="38" rx="19" fill="#eef2f7"/>
    <rect x="228" y="344" width="820" height="38" rx="19" fill="url(#make)"/>
    <text x="1070" y="370" font-size="19" font-weight="850" fill="#1d4ed8">2,435</text>
    <rect x="228" y="392" width="1130" height="24" rx="12" fill="#f1f5f9"/>
    <rect x="228" y="392" width="776" height="24" rx="12" fill="#94a3b8"/>
    <text x="1026" y="410" font-size="17" font-weight="800" fill="#475569">2,305</text>

    <text x="126" y="496" font-size="42" font-weight="900" fill="#0b1f3a">2</text>
    <rect x="228" y="452" width="1130" height="38" rx="19" fill="#eef2f7"/>
    <rect x="228" y="452" width="414" height="38" rx="19" fill="url(#make)"/>
    <text x="664" y="478" font-size="19" font-weight="850" fill="#1d4ed8">1,230</text>
    <rect x="228" y="500" width="1130" height="24" rx="12" fill="#f1f5f9"/>
    <rect x="228" y="500" width="382" height="24" rx="12" fill="#94a3b8"/>
    <text x="632" y="518" font-size="17" font-weight="800" fill="#475569">1,135</text>

    <text x="126" y="604" font-size="42" font-weight="900" fill="#0b1f3a">4</text>
    <rect x="228" y="560" width="1130" height="38" rx="19" fill="#eef2f7"/>
    <rect x="228" y="560" width="209" height="38" rx="19" fill="url(#make)"/>
    <text x="459" y="586" font-size="19" font-weight="850" fill="#1d4ed8">620</text>
    <rect x="228" y="608" width="1130" height="24" rx="12" fill="#f1f5f9"/>
    <rect x="228" y="608" width="175" height="24" rx="12" fill="#94a3b8"/>
    <text x="425" y="626" font-size="17" font-weight="800" fill="#475569">520</text>

    <text x="126" y="712" font-size="42" font-weight="900" fill="#0b1f3a">8</text>
    <rect x="228" y="668" width="1130" height="38" rx="19" fill="#eef2f7"/>
    <rect x="228" y="668" width="128" height="38" rx="19" fill="url(#make)"/>
    <text x="378" y="694" font-size="19" font-weight="850" fill="#1d4ed8">380</text>
    <rect x="228" y="716" width="1130" height="24" rx="12" fill="#f1f5f9"/>
    <rect x="228" y="716" width="76" height="24" rx="12" fill="#94a3b8"/>
    <text x="326" y="734" font-size="17" font-weight="800" fill="#475569">225</text>
  </g>
  <text x="88" y="823" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#41536b">Local simulation generated July 27, 2026 UTC · Results describe the fixture, not DeepSeek capacity</text>
  <text x="1512" y="823" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1d4ed8">0 PROVIDER REQUESTS</text>
</svg>
